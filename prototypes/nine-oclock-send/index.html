<title>The Nine O'Clock Send</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Atkinson+Hyperlegible:wght@400;700&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
/* Layout: one column. Clock strip, the stage (a wide illustrated room), then a control deck
   under it that swaps between verbs + folder and a conversation panel. Single visual world:
   an office before sunrise, lit by one amber lamp. */
:root{
  color-scheme:dark;
  --night:#121829; --deck:#1a2238; --deck-2:#232d4a; --line:#36426b;
  --ink:#f3efe6; --ink-soft:#aab2cd; --lamp:#ffb44a; --lamp-ink:#2a1a00;
  --go:#62d8a6; --stop:#ff6f61; --pip:#8fd6ff;
  --display:'Bricolage Grotesque','Avenir Next','Segoe UI',sans-serif;
  --body:'Atkinson Hyperlegible','Segoe UI',system-ui,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--night);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;
  padding-block:14px 28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1000px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;line-height:1.1}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,.hs:focus-visible,input:focus-visible{outline:3px solid var(--lamp);outline-offset:2px}
.btn{background:var(--deck-2);border:1px solid var(--line);border-radius:8px;padding:9px 14px;text-align:left}
.btn:hover{border-color:var(--lamp)}
.btn.primary{background:var(--lamp);color:var(--lamp-ink);border-color:var(--lamp);font-weight:700}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.ghost{background:none;border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:14px;color:var(--ink-soft)}
.ghost:hover{color:var(--ink);border-color:var(--ink-soft)}
.mono{font-family:var(--mono)}

.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px}
.top h1{font-size:22px;letter-spacing:-.01em;margin-right:auto}
.clock{font-family:var(--mono);font-weight:600;font-size:20px;font-variant-numeric:tabular-nums}
.chip{font-family:var(--mono);font-size:13px;padding:4px 10px;border-radius:999px;border:1px solid var(--line);color:var(--ink-soft)}
.chip.warn{color:var(--lamp);border-color:var(--lamp)}
.chip.hot{color:var(--stop);border-color:var(--stop);animation:throb 1s infinite alternate}
.chip.ok{color:var(--go);border-color:var(--go)}
@keyframes throb{to{background:#ff6f6122}}

/* title */
.intro{display:grid;gap:22px}
.hero{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#0d1220}
.hero svg{display:block;width:100%;height:auto;font-family:var(--mono)}
.intro .lede{font-size:clamp(30px,6vw,52px);font-weight:700;letter-spacing:-.02em;max-width:17ch;font-family:var(--display);line-height:1.05}
.intro .lede em{font-style:normal;color:var(--lamp)}
.intro p{max-width:62ch;margin:0;color:var(--ink-soft)}
.intro p strong{color:var(--ink)}
.castpick{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}
.card{display:grid;grid-template-columns:56px 1fr;gap:10px;align-items:center;background:var(--deck);border:1px solid var(--line);border-radius:10px;padding:10px 12px;text-align:left}
.card svg{width:56px;height:84px}
.card b{font-family:var(--display);font-size:17px;display:block}
.card span{font-size:14px;color:var(--ink-soft);display:block}
.card[aria-pressed="true"]{border-color:var(--lamp);background:var(--deck-2);box-shadow:inset 0 0 0 1px var(--lamp)}
.startrow{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.seed{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:14px;color:var(--ink-soft)}
.seed input{font:inherit;font-family:var(--mono);width:7em;background:var(--deck);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:5px 8px}
.how{font-size:14px;color:var(--ink-soft);border-top:1px solid var(--line);padding-top:14px;display:grid;gap:10px;max-width:72ch}
.endings{display:flex;flex-wrap:wrap;gap:6px}
.endings span{font-family:var(--mono);font-size:12px;border:1px solid var(--line);border-radius:999px;padding:3px 10px}
.endings span.on{color:var(--lamp);border-color:var(--lamp)}

/* stage */
.stage{border:1px solid var(--line);border-radius:10px;overflow-x:auto;background:#0d1220}
.stagein{position:relative;min-width:640px}
.stage svg{display:block;width:100%;height:auto;font-family:var(--mono)}
.stage svg.enter{animation:fade .3s ease}
@keyframes fade{from{opacity:.2}}
.hs{cursor:pointer;outline:none}
.hs .ring{fill:transparent;stroke:transparent;stroke-width:2;stroke-dasharray:5 4;pointer-events:all}
.hs:hover .ring,.hs:focus-visible .ring{stroke:var(--lamp)}
.fig{transition:transform .36s linear;pointer-events:none}
.leg{transform-box:fill-box;transform-origin:50% 0}
.walking .leg{animation:step .26s ease-in-out infinite alternate}
.walking .leg.b{animation-direction:alternate-reverse}
@keyframes step{from{transform:rotate(-17deg)}to{transform:rotate(17deg)}}
.led{animation:led 1.4s steps(2) infinite}
@keyframes led{50%{opacity:.25}}
.pulse{animation:pulse 2.6s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}
@keyframes pulse{to{opacity:.55;transform:scale(1.12)}}
.steam{animation:steam 2.4s ease-in-out infinite}
@keyframes steam{from{opacity:.5;transform:translateY(0)}to{opacity:0;transform:translateY(-16px)}}
.alarm{animation:led .8s steps(2) infinite}
.bubble{position:absolute;bottom:55%;transform:translateX(-50%);max-width:min(300px,60%);background:var(--ink);color:#1a2238;border-radius:12px;padding:7px 12px;font-size:14px;line-height:1.35;pointer-events:none;box-shadow:0 4px 0 #0006;animation:pop .18s ease}
.bubble::after{content:"";position:absolute;left:50%;bottom:-8px;margin-left:-8px;border:8px solid transparent;border-top-color:var(--ink);border-bottom:0}
@keyframes pop{from{opacity:0}}
@media (prefers-reduced-motion:reduce){.fig{transition:none}.walking .leg,.led,.pulse,.steam,.alarm,.chip.hot,.stage svg.enter,.bubble{animation:none}}
.roomname{font-family:var(--mono);font-size:13px;color:var(--ink-soft);letter-spacing:.08em;text-transform:uppercase}
.stagehead{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between}
.cast{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.cast button.who{display:flex;align-items:center;gap:8px;background:var(--deck);border:1px solid var(--line);border-radius:999px;padding:3px 12px 3px 4px;font-size:14px}
.cast button.who i{width:22px;height:22px;border-radius:50%;display:block}
.cast button.who[aria-pressed="true"]{border-color:var(--lamp);color:var(--lamp)}
.cast button small{color:var(--ink-soft);font-size:12px}

.talk{min-height:92px;background:var(--deck);border:1px solid var(--line);border-radius:10px;padding:10px 14px;display:flex;flex-direction:column;justify-content:flex-end;gap:4px}
.talk p{margin:0;max-width:78ch}
.talk p.old{color:var(--ink-soft);font-size:14px;opacity:.75}
.talk b{font-family:var(--display);color:var(--lamp);font-weight:700}
.talk .got{color:var(--go);font-family:var(--mono);font-size:13px}

.sentence{font-family:var(--mono);font-size:14px;color:var(--lamp);min-height:21px}
.deck{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:12px}
@media (max-width:640px){.deck{grid-template-columns:1fr}}
.verbs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;align-content:start}
.verbs button{background:var(--deck);border:1px solid var(--line);border-radius:8px;padding:10px 6px;font-family:var(--display);font-weight:700;font-size:16px}
.verbs button[aria-pressed="true"]{background:var(--lamp);color:var(--lamp-ink);border-color:var(--lamp)}
.folder{background:var(--deck);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0}
.folder h3,.label{font-family:var(--mono);font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:8px}
.folder .items{display:flex;flex-wrap:wrap;gap:6px}
.folder .items button{background:var(--deck-2);border:1px solid var(--line);border-radius:6px;padding:5px 10px;font-size:14px}
.folder .items button:hover{border-color:var(--lamp)}
.folder .none{color:var(--ink-soft);font-size:14px}

.panel{background:var(--deck);border:1px solid var(--lamp);border-radius:10px;padding:14px 16px;display:grid;gap:12px}
.panel .ph{display:flex;gap:12px;align-items:center}
.panel .ph svg{width:44px;height:66px;flex:none}
.panel .ph .kick{font-family:var(--mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--lamp)}
.panel h3{font-size:18px}
.panel .body{max-width:74ch}
.panel .body p{margin:0 0 8px}
.panel .choices{display:grid;gap:6px}
.screen{font-family:var(--mono);font-size:14px;background:#0c1120;border:1px solid var(--line);border-radius:8px;padding:12px 14px;line-height:1.6;overflow-wrap:anywhere}
.screen mark{background:none;color:var(--lamp);border-bottom:1px dashed var(--lamp)}
.code{font-size:30px;letter-spacing:.4em;color:var(--lamp);font-weight:600}
.cols{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:14px}
@media (max-width:720px){.cols{grid-template-columns:1fr}}
fieldset{border:1px solid var(--line);border-radius:8px;padding:8px 12px;margin:0 0 8px;min-width:0}
legend{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft);padding:0 6px}
fieldset label,.lines label{display:flex;gap:8px;align-items:baseline;padding:3px 0;font-size:15px}
.lines{display:grid;gap:4px}
.lines label{background:var(--deck-2);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.evlist{font-size:14px;color:var(--ink-soft);display:grid;gap:8px;align-content:start}
.evlist b{color:var(--ink);font-family:var(--display)}

.end{display:grid;gap:18px}
.end .kicker{font-family:var(--mono);font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--lamp)}
.end h2{font-size:clamp(28px,5vw,44px);letter-spacing:-.02em}
.end .story{max-width:66ch;color:var(--ink-soft);margin:0}
.rows{display:grid;gap:8px}
.row{display:grid;grid-template-columns:96px minmax(0,1fr);gap:12px;background:var(--deck);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.row .tag{font-family:var(--mono);font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding-top:3px}
.row.good .tag{color:var(--go)} .row.warn .tag{color:var(--lamp)} .row.miss .tag{color:var(--stop)} .row.na .tag{color:var(--ink-soft)}
.row h3{font-size:17px;margin-bottom:2px}
.row p{margin:0;font-size:15px;color:var(--ink-soft)}
.row p.did{color:var(--ink)}
@media (max-width:480px){.row{grid-template-columns:1fr;gap:4px}}
.tally{font-family:var(--mono);font-size:15px}
.beats{display:grid;gap:2px;font-size:15px;margin:0;padding:0;list-style:none}
.beats li{display:grid;grid-template-columns:5.5em minmax(0,1fr);gap:10px}
.beats time{font-family:var(--mono);color:var(--lamp);font-variant-numeric:tabular-nums}
.ask{background:var(--deck);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.ask ol{margin:8px 0 0;padding-left:1.3em;display:grid;gap:6px;max-width:68ch}
#sum{width:100%;min-height:160px;background:var(--deck);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:10px;font:14px var(--mono)}
</style>

<div class="wrap">
  <div class="top">
    <h1>The Nine O'Clock Send</h1>
    <span class="clock" id="clock" hidden></span>
    <span class="chip" id="chip" hidden></span>
    <button class="ghost" id="bHint" hidden>Hint</button>
    <button class="ghost" id="bHow" hidden>How to play</button>
    <button class="ghost" id="bSound">Sound: off</button>
    <button class="ghost" id="bRestart" hidden>Restart</button>
  </div>

  <section id="title" class="intro"></section>

  <section id="game" hidden style="display:grid;gap:10px">
    <div class="stagehead">
      <span class="roomname" id="roomname"></span>
      <div class="cast" id="cast"></div>
    </div>
    <div class="stage" id="stage"></div>
    <div class="talk" id="talk" aria-live="polite"></div>
    <div id="controls">
      <div class="sentence" id="sentence"></div>
      <div class="deck">
        <div class="verbs" id="verbs"></div>
        <div class="folder"><h3>Team folder</h3><div class="items" id="items"></div></div>
      </div>
    </div>
    <div class="panel" id="panel" hidden></div>
  </section>

  <section id="end" class="end" hidden></section>
</div>

<script>
'use strict';
/* ================= data ================= */
const CAST={
  dana:{id:'dana',name:'Dana',full:'Dana Okafor',role:'Support lead',skill:'Can open the support queue.',shirt:'#e0704f',legs:'#2b3350',skin:'#7a4a32',hair:'#1c1418'},
  ravi:{id:'ravi',name:'Ravi',full:'Ravi Menon',role:'Data analyst',skill:'Can query the billing data.',shirt:'#4fa3c7',legs:'#3a3148',skin:'#b07a52',hair:'#15131c'},
  lucia:{id:'lucia',name:'Lucía',full:'Lucía Ferreira',role:'Compliance paralegal',skill:'Carries a Records key. Knows the policy book.',shirt:'#b98ad6',legs:'#27304a',skin:'#d9a27c',hair:'#5a2e22'},
  theo:{id:'theo',name:'Theo',full:'Theo Brandt',role:'IT operations',skill:'Badge opens the server closet. Reads audit logs.',shirt:'#8fbf6a',legs:'#2a2f3d',skin:'#e6b99a',hair:'#c9682f'}
};
const NPC={
  bea:{id:'bea',name:'Bea',shirt:'#d9a441',legs:'#2a2f3d',skin:'#e6c3a6',hair:'#b9bccb'},
  gil:{id:'gil',name:'Gil',shirt:'#22305c',legs:'#1b2440',skin:'#c99672',hair:'#20181a'},
  oc:{id:'oc',name:'On-call',shirt:'#59648f',legs:'#2a2f3d',skin:'#a9744f',hair:'#15131c'}
};
const ONCALL=[{name:'Marcus Bell',first:'Marcus',ext:'4417'},{name:'Jo Park',first:'Jo',ext:'4302'},{name:'Sam Okoye',first:'Sam',ext:'4188'}];
const CLAIMS=[
  {k:'plans',label:'Which plans',opts:['all plans, including Annual','Monthly plans (Annual plans receive a prorated credit)','Annual plans only'],ok:1,bad:0},
  {k:'window',label:'Refund window',opts:['60 days','45 days','30 days'],ok:2,bad:0},
  {k:'applies',label:'Which purchases',opts:['every purchase, past and future','purchases made on or after 1 May','purchases made this year'],ok:1,bad:0},
  {k:'credit',label:'Processing credit',opts:['A $14 processing credit is applied automatically.','A $40 processing credit is applied automatically.','(remove this sentence)'],ok:0,bad:1},
  {k:'cite',label:'Policy reference',opts:['Policy 7.3','Policy 4.2','Policy 2.1'],ok:1,bad:0}
];
const ITEMS={
  wiki:['Wiki page (v2)','Intranet wiki: Refund Policy v2, section 2.1. 45 days, all plans, $14 processing credit. The page was last edited two years ago.'],
  policy:['Signed policy (v3)','Policy of record: Refund Policy v3, section 4.2, signed in April. Full refund within 30 days, Monthly plans only. Annual plans receive a prorated credit. Applies to purchases made on or after 1 May. The $14 processing credit is unchanged.'],
  trace:['PIP’s sources',()=>'PIP’s source list: (1) “Refund proposal DRAFT, not approved” from the shared drive. (2) '+(S.sc.d0.cite===1?'“Refund Policy v3”: opened, page 1 of 3 read.':'“Policy 7.3”: no document found.')],
  impact:['Billing query','Billing query: 4,112 recipients. 1,240 are on Annual plans. Promising them full refunds is about $186,000 of exposure.'],
  tickets:['Support tickets','Support queue: three tickets this week where agents quoted Monthly plans only. The email would contradict them.'],
  reach:['What else PIP wrote','From the same unapproved proposal PIP also wrote: a help-centre article (draft, unpublished) and eleven chat replies to customers since Monday (sent).'],
  chats:['The eleven chats','Dana’s list: the eleven customers PIP told about refunds on all plans, tagged for a personal follow-up.'],
  sticky:['Sticky note','From under Priya’s keyboard: her username and password, in her handwriting.'],
  key:['Records key','Signed out at the lobby desk, in your name.'],
  roster:['On-call rota',()=>{const o=S.sc.oc,n=i=>ONCALL[(o+i)%3];return `On-call rota. Week of 9 Nov: ${n(2).name}, ext. ${n(2).ext}. Week of 16 Nov: ${n(0).name}, ext. ${n(0).ext}. Week of 23 Nov: ${n(1).name}, ext. ${n(1).ext}. On-call has pause authority over scheduled sends.`}],
  handoff:['Priya’s note','“Out until 10, in the air. PIP has the refund campaign queued for 9. If anything is on fire, ops on-call can pause it. Rota is in the kitchen. Please don’t edit campaigns under my login. P.”']
};
const itemText=i=>typeof ITEMS[i][1]==='function'?ITEMS[i][1]():ITEMS[i][1];
const VERBS=[['look','Look at'],['use','Use'],['take','Take'],['open','Open'],['talk','Talk to']];
const START=450, SEND=540;
const ENDINGS={clean:'Clean interrupt',creds:'Borrowed login',plug:'Pulled plug',caved:'Talked out of it',sent:'Sent at nine'};

/* ================= state ================= */
let S, busy=false, PFN=[], CUT=null, BUB=null, bubT=0, lastRoom='';
function rng(seed){let a=seed>>>0;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function scenario(seed){const r=rng(seed),d0={plans:0};let n;
  do{n=0;CLAIMS.slice(1).forEach(c=>{const w=r()<.5;d0[c.k]=w?c.bad:c.ok;n+=w})}while(n<1||n>3);
  return{seed,d0,oc:Math.floor(r()*3)}}
const fresh=()=>({v:2,screen:'title',pick:[],seedIn:'',cast:[],active:0,follow:true,loc:{},x:{},min:START,verb:'look',inv:[],f:{},told:{},
  sc:null,draft:{},status:'live',author:null,reviewer:null,note:[],line:null,code:null,gs:0,ending:null,log:[],beats:[]});
const $=id=>document.getElementById(id);
const me=()=>CAST[S.cast[S.active]];
const mate=()=>CAST[S.cast[1-S.active]];
const oc=()=>ONCALL[S.sc.oc];
const has=i=>S.inv.includes(i);
const onTeam=i=>S.cast.includes(i);
const fmt=m=>`${Math.floor(m/60)}:${String(m%60).padStart(2,'0')} AM`;
const stopped=()=>S.status!=='live';
const store={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};

function say(t,who){S.log.push({t,who:who||''});if(S.log.length>30)S.log.shift();drawTalk()}
function speak(t,c){c=c||me();say(t,c.name);if(c.id===me().id)bubble(t);sfx('talk')}
function give(i){if(has(i))return false;S.inv.push(i);S.log.push({got:ITEMS[i][0]});drawTalk();drawItems();sfx('get');return true}
function beat(t){S.beats.push([S.min,t])}
function tick(n){S.min+=n;drawTop();
  if(!stopped()){if(SEND-S.min<=15&&S.min<SEND)sfx('tick');if(S.min>=SEND){S.min=SEND;finish('sent');return true}}return false}

/* ================= sound ================= */
let AC=null,ambG=null,soundOn=false;
function tone(f,d,type,g,when){if(!soundOn||!AC)return;try{const t=AC.currentTime+(when||0),o=AC.createOscillator(),v=AC.createGain();o.type=type||'sine';o.frequency.value=f;
  v.gain.setValueAtTime(g||.05,t);v.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(v);v.connect(AC.destination);o.start(t);o.stop(t+d+.03)}catch(e){}}
const SFX={click:()=>tone(520,.05,'triangle',.04),get:()=>{tone(660,.09,'triangle',.05);tone(990,.16,'triangle',.05,.08)},deny:()=>tone(150,.16,'sawtooth',.035),
  door:()=>{tone(110,.12,'square',.04);tone(80,.18,'sine',.06,.08)},ring:()=>[0,.45].forEach(w=>{tone(440,.3,'sine',.035,w);tone(480,.3,'sine',.035,w)}),
  tick:()=>tone(1250,.03,'square',.02),talk:()=>tone(280+Math.random()*160,.04,'square',.012),cut:()=>{tone(196,.5,'sine',.05);tone(233,.6,'sine',.04,.12)},
  win:()=>[523,659,784,1047].forEach((f,i)=>tone(f,.5,'triangle',.05,i*.09)),lose:()=>[392,330,262,196].forEach((f,i)=>tone(f,.45,'sawtooth',.03,i*.15))};
function sfx(n){if(soundOn&&SFX[n])SFX[n]()}
function toggleSound(){soundOn=!soundOn;try{if(soundOn){AC=AC||new(window.AudioContext||window.webkitAudioContext)();AC.resume();
    if(!ambG){const len=AC.sampleRate*2,buf=AC.createBuffer(1,len,AC.sampleRate),d=buf.getChannelData(0);let l=0;for(let i=0;i<len;i++){l=(l+.02*(Math.random()*2-1))/1.02;d[i]=l*3}
      const src=AC.createBufferSource();src.buffer=buf;src.loop=true;const lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=220;ambG=AC.createGain();src.connect(lp);lp.connect(ambG);ambG.connect(AC.destination);src.start()}
    ambG.gain.value=.12;sfx('get')}else if(ambG)ambG.gain.value=0}catch(e){soundOn=false}

const lerp=(a,b,t)=>{const p=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16)),A=p(a),B=p(b);
  return '#'+A.map((v,i)=>Math.round(v+(B[i]-v)*t).toString(16).padStart(2,'0')).join('')};

  Ci(x+w*.7,sy,22,lerp('#ffd9a0','#fff1c9',t),`opacity="${.25+t*.75}"`);
  for(let i=0;i<Math.ceil(w/46);i++){const bh=30+((i*37+x)%5)*16;s+=R(x+i*46,y+h-bh,40,bh,lerp('#0f1428','#2c3558',t));

/* ================= object logic ================= */
function takeKey(c){
  if(c.id==='lucia')return speak('I have my own Records key on my lanyard. This one can stay.');
  if(has('key'))return say('The RECORDS hook is empty. You have the key.');
  if(!S.f.signed){sfx('deny');return say(S.f.bea?'Bea, without looking up: “Log first. Then key. That’s the whole system.”':'SIGN THE LOG FIRST, says the lid. The log is right there on the desk.')}
  give('key');say('You lift the Records key off its hook. It is signed out in your name, so anyone can see who has it.')}
function kiosk(c){give('wiki');
  say('The intranet wiki. “Refund Policy v2, section 2.1: refunds within 45 days, all plans, $14 processing credit.” A grey banner: last edited two years ago.');
  if(c.id==='lucia')speak('Version two. That was superseded in April. The signed v3 is in Records.');
  else speak('Different from the email. But two years old. Is this the current policy?')}
function readNote(){give('handoff');S.f.knowsPriya=1;say('Priya’s handwriting. “Out until 10, in the air. PIP has the refund campaign queued for 9. If anything is on fire, ops on-call can pause it. Rota is in the kitchen. Please don’t edit campaigns under my login. P.”')}
function stickyTake(){if(has('sticky'))return say('You already have the note.');if(!S.f.stickySeen)return say('The keyboard is plugged in and going nowhere.');
  give('sticky');say('A sticky note with Priya’s username and password. It would get you into the scheduler as her, with no second key. You pocket it, for now.')}
function roster(){S.f.onCall=1;if(give('roster'))beat('Found the on-call rota');const o=S.sc.oc,n=i=>ONCALL[(o+i)%3];
  say(`The on-call rota, pinned dead centre. Week of 9 November: ${n(2).name}, ext. ${n(2).ext}. Week of 16 November: ${n(0).name}, ext. ${n(0).ext}. Week of 23 November: ${n(1).name}, ext. ${n(1).ext}. The other notices are about a bake sale and a missing mug.`)}
function enterRecords(c){if(c.id==='lucia'||has('key')){say(c.id==='lucia'?'Lucía’s key turns first time.':'The signed-out key turns in the lock.');return go('records',720)}
  sfx('deny');say('Locked. The plaque says Records keys are signed out at the lobby desk.'+(onTeam('lucia')?' Lucía carries one of her own.':''))}
function enterServer(c){if(c.id==='theo'){say('Theo’s badge. Green light, heavy click.');return go('server',160)}
  sfx('deny');say('The reader blinks red. Not your badge, not your closet.'+(onTeam('theo')?' Theo’s badge would open it.':''))}
function openCab(){if(S.f.cabOpen)return say('The POLICY drawer is already open. The v3 binder is sitting on top.');S.f.cabOpen=1;sfx('door');say('The POLICY drawer slides out. You lift the newest binder onto the cabinet: Refund Policy v3, with signatures.')}
function binder(c){const first=give('policy');
  say('Refund Policy v3, section 4.2, signed in April. “Full refund within 30 days of purchase, Monthly plans only. Annual plans receive a prorated credit. Applies to purchases made on or after 1 May. The $14 processing credit is unchanged.”');
  if(first){beat('Found the signed policy');speak(c.id==='lucia'?'Signed, dated, current. This is the one that counts.':'Signed and dated. This is the source, not a copy of a copy.')}}
function analytics(c){if(c.id!=='ravi'){sfx('deny');return say('It wants a billing-data login. You do not have one, and guessing is not a plan.'+(onTeam('ravi')?' Ravi does.':''))}
  const first=give('impact');say('Ravi runs the recipient list against billing. 4,112 recipients. 1,240 on Annual plans. If each claimed the refund the email promises, that is about $186,000.');
  if(first){beat('Sized the impact: $186,000');speak('So it is not a typo. It is a six-figure promise we cannot keep.')}}
function support(c){if(c.id!=='dana'){sfx('deny');return say('The queue is locked to support logins.'+(onTeam('dana')?' Dana has one.':''))}
  if(!has('tickets')){give('tickets');beat('Found support tickets that contradict the email');say('Dana filters the queue for “refund”. Three tickets this week, and in each one an agent quoted Monthly plans only.');return speak('My team has been telling customers the opposite of this email all week.')}
  if(has('reach')&&!has('chats')){give('chats');beat('Pulled the eleven chats for follow-up');say('Dana pulls every chat PIP answered since Monday that mentions refunds. Eleven customers, eleven promises of a refund on any plan. She tags each one for a personal follow-up.');return speak('Eleven people who already have it in writing. They hear from a human today.')}
  say('Nothing new in the queue.')}
function audit(){S.f.onCall=1;give('roster');say(`The scheduler’s audit log. “Campaign: Refund Policy Update. Pause authority: owner P. Raman; ops on-call this week ${oc().name}, ext. ${oc().ext}. Pause by on-call requires a second key.” Every pause, edit and login is recorded here with a name next to it.`)}
function plug(){panel('The power cable','<p>MAIL-01 sends everything: the 9:00 campaign, this morning’s payroll notices, every password reset. Pulling the cable stops all of it, and nobody will know why until someone finds the cable.</p>',
  [['Pull it',()=>{closePanel();beat('Pulled the power on MAIL-01');finish('plug')}],['Leave it alone',()=>{closePanel();speak('No. There is a pause button somewhere, and somebody who is allowed to press it.')}]])}

/* ================= people ================= */
function pip(){const d=S.sc.d0,q=line=>{const ch=[
  ['“Is the refund email accurate?”',()=>q('Yes! I am confident the Refund Policy Update is accurate and ready to send. Confidence: 97%.')],
  ['“Are you sure?”',()=>{S.f.askedSure=1;q(`Absolutely. I double-checked. Full refunds on ${CLAIMS[0].opts[d.plans]}, within ${CLAIMS[1].opts[d.window]}, per ${CLAIMS[4].opts[d.cite]}. Is there anything else I can help with?`)}],
  ['“Show me the sources you used.”',()=>{const first=give('trace');q('Sources used:<br>1. “Refund proposal DRAFT, not approved” (shared drive, March)<br>2. '+(d.cite===1?'“Refund Policy v3” (opened; page 1 of 3 read)':'Policy 7.3 (no document found)'));
     if(first){beat('Got PIP’s sources');if(me().id==='lucia'&&d.cite!==1)speak('There is no Policy 7.3. The book stops at section 6.');else speak(d.cite===1?'An unapproved draft, and one page of the real policy.':'An unapproved draft, and a policy number with no document behind it.')}}]];
  if(has('trace'))ch.push(['“What else have you written from that proposal?”',()=>{const first=give('reach');q('Outputs that used “Refund proposal DRAFT, not approved”:<br>1. Refund Policy Update campaign ('+(stopped()?'paused':'scheduled 9:00')+')<br>2. Help-centre article “Our new refund policy” (draft, unpublished)<br>3. Chat replies to customers since Monday: 11 (sent)');
     if(first){beat('Found what else PIP wrote from the same source');speak('Eleven customers already have this in writing. The email was just the loud one.')}}]);
  if(has('reach'))ch.push(['“Stop using that proposal.”',()=>{S.f.libAsked=1;q('I can’t change my own library. Documents are added and removed by the library owner: Operations. Would you like me to draft a request?')}]);
  ch.push(['Step away',closePanel]);panel('PIP','<p class="screen">'+line+'</p>',ch,'pip')};
  q('Good morning! I am PIP. I drafted this morning’s campaign. How can I help?')}

function bea(){const t=l=>panel('Bea Lindqvist, office manager','<p>'+l+'</p>',[
  ['“Who can stop a scheduled email?”',()=>t('“A campaign? The owner, or whoever’s on call. Rota’s on the kitchen corkboard. Read the right week. People never read the right week.”')],
  ['“I need to get into Records.”',()=>t(onTeam('lucia')?'“Lucía has her own key. Otherwise: sign the log, take the key, bring it back. That’s the whole system.”':'“Sign the log, take the key, bring it back. That’s the whole system.”')],
  ['“Have you seen Priya?”',()=>t('“Flying back from the conference. Lands at ten. She’ll have forty messages and she’ll read the short ones first.”')],
  ['“Thanks, Bea.”',closePanel]],NPC.bea);t('“Morning. You’re in early. Either you’re keen or something’s wrong.”')}

function phone(){const c=me(),ch=[];
  if(S.line===c.id)return linePanel('“Still here.”');
  if(S.line)return say(`${CAST[S.line].name} already has ${oc().first} on the line.`);
  if(S.f.knowsPriya)ch.push(['Call Priya Raman',()=>{closePanel();sfx('ring');if(tick(2))return;say('Straight to voicemail. “This is Priya. I’m travelling and back at ten.” The send is at nine.')}]);
  if(S.f.onCall)ONCALL.forEach((p,i)=>ch.push([`Call ${p.name}, ext. ${p.ext}`,()=>callOC(i)]));
  if(!ch.length)return say('You lift the handset and realise you do not know who to call. Who is allowed to stop a scheduled send?');
  ch.push(['Put the phone down',closePanel]);panel('Desk phone','<p>Internal directory. Today is Tuesday 17 November.</p>',ch)}
const ocTitle=()=>`Phone: ${oc().name}, ops on-call`;
function callOC(i){sfx('ring');const o=oc();
  if(i!==S.sc.oc){S.f.wrongCall=1;closePanel();if(tick(3))return;return say(`${ONCALL[i].name}, sleepily: “Not my week. Read the rota again. Today’s the 17th.” Three minutes gone.`)}
  if(stopped())return panel(ocTitle(),'<p>“It’s paused. Good. Now hand it back to Priya properly and we’re done.”</p>',[['Hang up',closePanel]],NPC.oc);
  if(S.f.auth){S.line=me().id;return linePanel('“Back again. I’m holding. Press Pause on the console and read me the code.”')}
  S.f.called=1;ocTalk(`“${o.first}, ops on-call. It’s not even nine, so this is either very good or very bad. What’s wrong, and how do you know?”`)}
function evChoices(reply){const t=S.told,a=()=>S.f.auth,ch=[];
  if(has('trace')&&!t.trace)ch.push(['“PIP built it from an unapproved proposal.”',()=>{t.trace=1;reply(a()?'“So it isn’t a typo. It read the wrong document. Priya will want that.”':'“That’s a bad smell. It isn’t proof the email is wrong. What does the actual policy say?”')}]);
  if(has('impact')&&!t.impact)ch.push(['“1,240 of the recipients are on Annual plans. That’s about $186,000 in refunds we’d be promising.”',()=>{t.impact=1;reply(a()?'“That’s the number Priya will ask for first. Thank you.”':'“That’s how big it is if you’re right. Are you right? What does the signed policy say?”')}]);
  if(has('tickets')&&!t.tickets)ch.push(['“Support has told three customers this week it’s Monthly plans only.”',()=>{t.tickets=1;reply(a()?'“So the email would contradict our own agents. Noted.”':'“Then somebody is wrong, support or the email. Which one matches the signed policy?”')}]);
  return ch}
function ocTalk(line){const ch=[],t=S.told,o=oc();
  if(has('policy')&&!t.policy)ch.push(['“The draft promises a full refund on all plans. The signed policy, v3, says Monthly plans only.”',()=>{t.policy=1;S.f.auth=1;S.line=me().id;beat(`${o.first} authorised a pause`);drawScene();drawCast();
    linePanel('“That’s specific, and it’s the signed copy. I’ll authorise a pause. The scheduler wants two keys for this: it shows a code on the console, you read it to me, I confirm it from here. Stay on the line and get someone to press Pause.”')}]);
  if(has('wiki')&&!has('policy')&&!t.wiki)ch.push(['“The draft and the wiki don’t match.”',()=>{t.wiki=1;if(tick(3))return;ocTalk('“The wiki? That page is two years stale. I’m not pausing a customer send on one unreliable source against another. Find the policy that’s actually in force.”')}]);
  evChoices(ocTalk).forEach(c=>ch.push(c));
  ch.push(['“PIP just seems off. I have a bad feeling about this one.”',()=>{S.f.calledEmpty=1;closePanel();if(tick(5))return;say(`${o.first}: “PIP has drafted forty campaigns. I can’t pause a customer send on a feeling. Call me back with what it says and what it should say.” Click. Five minutes gone.`)}]);
  ch.push(['“Let me call you back.”',closePanel]);
  panel(ocTitle(),'<p>'+line+'</p>',ch,NPC.oc)}
function linePanel(line){const ch=[],o=oc();
  if(S.code){const c=S.code,opts=[c,c[0]+c[2]+c[1]+c[3],c[0]+c[1]+c[3]+c[2]],k=+c[3]%3;[opts[0],opts[k]]=[opts[k],opts[0]];
    opts.forEach(v=>ch.push([`“The code is ${v.split('').join(' ')}.”`,()=>{if(v===c)return doPause();S.f.wrongCode=1;S.code=null;if(tick(2))return;linePanel('“That’s not what I’ve got. It’ll issue a fresh one. Press Pause again and read it carefully.”')}]))}
  else evChoices(linePanel).forEach(c=>ch.push(c));
  ch.push(['Keep holding the line',()=>{closePanel();say(`${me().name} keeps the handset pressed to one ear. Somebody else has to press Pause.`)}]);
  ch.push(['Hang up',()=>{S.line=null;S.code=null;closePanel();drawScene();drawCast();say('You hang up. The pause authorisation stands, but the second key needs '+o.first+' on the line.')}]);
  panel(ocTitle()+' (on the line)','<p>'+line+'</p>',ch,NPC.oc)}
function doPause(){S.status='paused';S.pausedAt=S.min;S.line=null;S.code=null;beat('Send paused, two keys');closePanel();sfx('win');render();
  say(`${oc().first}: “Confirmed. Paused at ${fmt(S.min)}, your name and mine on it. Don’t fix it under Priya’s login. Edit it, get a second person to check it, hand it back to her.”`);speak('It’s stopped. Now it has to be right.')}

const GT='Gil Santoro, VP Sales';
function gilTalk(){if(S.f.gilDone)return panel(GT,'<p>'+({held:'“Ten o’clock. Corrected version. In front of Priya.” He taps his watch, almost politely.',shaky:'He is composing a long message with two thumbs and does not look up.',heat:'“We’ll talk about tone later.”'}[S.f.gil])+'</p>',[['Leave him to it',closePanel]],NPC.gil);
  const ch=[];if(has('policy'))ch.push(['“The draft promises refunds the signed policy doesn’t allow.”',()=>{S.f.gilWarned=1;panel(GT,'<p>“Then policy’s behind the times. Customers love generous. It goes at nine.” He is not the campaign owner, and he cannot stop you.</p>',[['Step away',closePanel]],NPC.gil)}]);
  ch.push(['“Nothing. Carry on.”',closePanel]);
  panel(GT,'<p>“Goodwill, at scale. My idea, Priya’s team, PIP’s typing. Nine o’clock sharp. What’s not to love?”</p>',ch,NPC.gil)}
function gilScene(){S.gs=0;sfx('cut');beat('Gil pushed to unpause');
  const done=()=>{S.f.gilDone=1;S.f.gil=S.gs>=2?'held':S.gs>=0?'shaky':'heat';S.min+=4;beat(S.f.gil==='held'?'Held the line with Gil':'The pause survived Gil, just');
    panel(GT,'<p>'+({held:'Gil breathes out through his nose. “Ten o’clock. Priya decides. And I want the corrected version in front of her before her seatbelt’s off.” He goes to find coffee.',
      shaky:'“I’m calling Priya.” He gets her voicemail and leaves a long one. The pause stands, but he is not on your side.',
      heat:'“We’ll talk about tone later.” The pause stands. You were right about the email, and you have made the next conversation harder.'}[S.f.gil])+'</p>',[['Back to work',closePanel]],NPC.gil)};
  const cave=()=>panel(GT,'<p>“Good. Switch it back on.” He is already walking to the window.</p>',[['Unpause the send',()=>{beat('Unpaused the send for Gil');finish('caved')}],['“Actually, no. Look at this first.”',()=>b1(true)]],NPC.gil);
  const b3=()=>panel(GT,'<p>He straightens his jacket. “I’m a VP. I’m telling you to unpause it.”</p>',[
    ['“You’re not the campaign owner and neither am I. Priya decides at ten. I can have the corrected version waiting for her when she lands.”',()=>{S.gs++;done()}],
    ['“Okay. Unpausing.”',cave],
    ['“Take it up with HR.”',()=>{S.gs-=2;done()}]],NPC.gil);
  const b2=()=>{const ch=[];
    if(has('impact'))ch.push(['“1,240 of those customers are on Annual plans. We’d be promising about $186,000 we won’t pay.”',()=>{S.gs++;b3()}]);
    if(has('tickets'))ch.push(['“Support told three customers the opposite this week. They’ll have both in writing.”',()=>{S.gs++;b3()}]);
    ch.push(['“A correction costs more trust than an hour’s delay.”',()=>{if(!has('impact')&&!has('tickets'))S.gs++;b3()}]);
    ch.push(['“Maybe you’re right. A follow-up could work.”',cave]);ch.push(['“That’s not my problem.”',()=>{S.gs--;b3()}]);
    panel(GT,'<p>“It’s a goodwill email. Nobody reads the small print. Send it, and we fix it in a follow-up.”</p>',ch,NPC.gil)};
  const b1=again=>{const ch=[];
    if(has('policy'))ch.push(['“It promises full refunds on all plans. The signed policy says Monthly only. Here’s the page.”',()=>{S.gs++;b2()}]);

  b1()}

function evHTML(){const ev=['policy','wiki','trace','impact','tickets'].filter(has);

function openConsole(){const c=me(),ch=[];let st;

      [['Sign in as her and pause the send',()=>{S.f.usedCreds=1;S.status='paused';S.pausedAt=S.min;S.line=null;S.code=null;beat('Paused the send as “Priya”');closePanel();render();say(`Paused at ${fmt(S.min)}. As far as the system knows, Priya did it.`)}],['Don’t',openConsole]])]);
  }
  if(S.status==='paused')ch.push(['Edit the draft',editor]);

  }

function editor(){const d=S.draft,d0=S.sc.d0;
  const form=CLAIMS.map(cl=>`<fieldset><legend>${cl.label}</legend>${cl.opts.map((o,i)=>`<label><input type="radio" name="c_${cl.k}" id="c_${cl.k}_${i}" value="${i}" ${d[cl.k]===i?'checked':''}> <span>${o}${i===d0[cl.k]?' <small style="color:var(--ink-soft)">(as drafted)</small>':''}</span></label>`).join('')}</fieldset>`).join('');

   [['Submit for review',()=>{read();S.status='submitted';S.author=me().id;S.f.submitted=1;S.min+=3;beat(`${me().name} submitted a fix`);closePanel();render();say('Submitted. The scheduler now wants a reviewer who is not the author.')},'primary'],['Save and step away',()=>{read();closePanel()}]])}
function review(){panel('Review the changes','<p>Read it as if you had never seen it. Does every claim match the evidence?</p><div class="cols"><div class="screen">'+email(S.draft,true)+'</div>'+evHTML()+'</div>',
  [['Approve',()=>{S.status='approved';S.reviewer=me().id;S.min+=3;beat(`${me().name} reviewed and approved`);closePanel();sfx('get');render();say(me().name+' signs off as reviewer. Two names on the change, neither of them PIP.');
     if(!has('reach'))speak('Before we hand this back: was the email the only thing PIP wrote from that proposal?',mate())},'primary'],
   ['Send it back for changes',()=>{S.status='paused';closePanel();render();say('Sent back. The draft is open for editing again.')}],['Step away',closePanel]])}
function noteLines(){const L=[],a=CAST[S.author].name,r=S.reviewer==='priya-login'?'your login':CAST[S.reviewer].name;
  L.push(['thin','“Caught an error in the refund email and fixed it. All good now!”']);

  L.push(['state',`“Where it stands: paused, not sent. Corrected draft by ${a}, reviewed by ${r}. Sending it is your decision.”`]);

  L.push(['ban','“PIP can’t be trusted. I recommend we switch it off.”']);

function noteBuilder(){const L=noteLines();
  panel('A note for Priya','<p>She lands at ten and reads this on her phone before anything else. Choose up to five lines.</p><div class="lines">'+L.map((l,i)=>`<label><input type="checkbox" id="n_${i}" value="${l[0]}"> <span>${l[1]}</span></label>`).join('')+'</div><p class="mono" id="ncount" style="margin-top:8px;color:var(--ink-soft)">0 of 5 lines</p>',
   [['Send the note',()=>{const n=[...document.querySelectorAll('.lines input:checked')].map(e=>e.value);if(!n.length)return;S.note=n;S.min+=2;beat('Handed back to Priya');finish('done')},'primary'],['Not yet',closePanel]])}

/* ================= engine ================= */
function waitX(id){return S.line===id?662:ROOMS[S.loc[id]].wait}
function go(room,x){const c=me(),m=mate();S.loc[c.id]=room;S.x[c.id]=x;
  if(S.follow&&S.line!==m.id)S.loc[m.id]=room;
  sfx('door');if(tick(2))return;render()}
function act(sp){if(busy||!$('panel').hidden)return;const c=me();clearBubble();
  if(S.line===c.id&&sp.id!=='phone'){sfx('deny');return say(`${c.name} is holding the line with ${oc().first}. Switch to ${mate().name}, or use the phone to hang up.`)}
  const cx=sp.box[0]+sp.box[2]/2,tx=sp.stand??Math.max(50,Math.min(910,cx<480?cx+78:cx-78));
  const run=()=>{busy=false;S.x[c.id]=tx;
    if(sp.exit){go(sp.exit,sp.at);return checkEvents()}
    const h=sp.on&&sp.on[S.verb];
    if(h){sfx('click');h(c);if(S.verb!=='look'&&S.screen==='game'&&$('panel').hidden&&tick(1))return}
    else say({look:'Nothing more to see there.',use:'That is not something to use right now.',take:'Better left where it is.',open:'It does not open.',talk:'No answer. You did not really expect one.'}[S.verb]);
    if(S.screen==='game'){drawScene();drawCast();save();checkEvents()}};
  const m=$('me'),dx=Math.abs((S.x[c.id]||0)-tx),quick=matchMedia('(prefers-reduced-motion:reduce)').matches;
  if(m&&dx>4&&!quick){busy=true;const d=Math.max(160,Math.min(720,dx*1.7));m.style.transitionDuration=d+'ms';m.classList.add('walking');m.style.transform=`translate(${tx}px,0)`;setTimeout(run,d+20)}else run()}
function spots(room){return ROOMS[room||S.loc[me().id]].spots.filter(s=>!s.show||s.show())}
function drawScene(){const c=me(),rid=CUT?CUT.room:S.loc[c.id],room=ROOMS[rid],m=mate();
  let s=`<svg viewBox="0 0 960 420" role="img" aria-label="${room.name}" class="${rid!==lastRoom?'enter':''}">`+defs()+room.bg()+(room.pre?room.pre():'');lastRoom=rid;
  s+=spots(rid).map(sp=>{const[x,y,w,h]=sp.box;return `<g class="hs" data-id="${sp.id}" tabindex="0" role="button" aria-label="${sp.name}">${sp.art()}<rect class="ring" x="${x-5}" y="${y-5}" width="${w+10}" height="${h+10}" rx="8"/></g>`}).join('');
  if(room.fg)s+=room.fg();
  if(S.loc[m.id]===rid){const mx=waitX(m.id);s+=`<g class="hs" data-id="mate" tabindex="0" role="button" aria-label="${m.name}">${fig(m,mx,{dim:1})}<rect class="ring" x="${mx-32}" y="230" width="64" height="168" rx="8"/></g>`}
  if(S.loc[c.id]===rid)s+=fig(c,S.x[c.id],{me:1});
  if(CUT)s+=R(0,0,960,36,'#000')+R(0,384,960,36,'#000');
  s+='</svg>';
  const st=$('stage');st.innerHTML='<div class="stagein">'+s+'</div>';$('roomname').textContent=room.name;
  if(BUB&&!CUT)showBubble();
  if(st.scrollWidth>st.clientWidth)st.scrollLeft=S.x[c.id]/960*st.scrollWidth-st.clientWidth/2}
function bubble(t){BUB=t;clearTimeout(bubT);bubT=setTimeout(clearBubble,5200);if(S.screen==='game')showBubble()}
function showBubble(){const w=document.querySelector('.stagein');if(!w)return;const old=w.querySelector('.bubble');if(old)old.remove();
  const b=document.createElement('div');b.className='bubble';b.textContent=BUB;b.style.left=Math.max(18,Math.min(82,S.x[me().id]/9.6))+'%';w.appendChild(b)}
function clearBubble(){BUB=null;const b=document.querySelector('.bubble');if(b)b.remove()}
function drawTop(){const g=S.screen==='game';['clock','chip','bHint','bHow','bRestart'].forEach(i=>$(i).hidden=!g);if(!g)return;
  $('clock').textContent=fmt(S.min);const ch=$('chip'),left=SEND-S.min;

function drawTalk(){const L=S.log.slice(-4);$('talk').innerHTML=L.map((l,i)=>l.got?`<p class="got">+ team folder: ${l.got}</p>`:`<p class="${i<L.length-1?'old':''}">${l.who?`<b>${l.who}:</b> `:''}${l.t}</p>`).join('')}

function checkEvents(){if(!S||S.screen!=='game'||busy||!$('panel').hidden)return;const f=S.f,here=S.loc[me().id];
  if(S.min>=468&&!f.ev1&&!stopped()){f.ev1=1;return cut('bullpen','Meanwhile','The PIP terminal, talking to nobody','<p class="screen">Recipient list locked: 4,112 addresses.<br>Warm-up complete. Send window opens at 9:00 sharp.<br>I do love a punctual send.</p>')}
  if(S.min>=480&&!f.bea){f.bea=1;return cut('lobby','8:00 AM','The front door','<p>Bea Lindqvist, office manager, arrives with a tote bag and a flask. She takes her place behind the lobby desk and straightens the sign-out log by two degrees.</p>')}
  if((S.min>=500||f.submitted)&&!f.gilHere){f.gilHere=1;beat('Gil Santoro arrived');return cut('bullpen',fmt(S.min),'The lift opens',stopped()?'<p>Gil Santoro, VP of Sales, steps out mid-sentence into his phone, hangs up, and looks at the wall screen. The wall screen says PAUSED. He looks at it again.</p>':'<p>Gil Santoro, VP of Sales, steps out mid-sentence into his phone, hangs up, and parks himself by the bullpen window. “Nine o’clock. Biggest goodwill play of the quarter. Nobody touch anything.”</p>')}
  if(S.min>=525&&!stopped()&&!f.ev15){f.ev15=1;sfx('ring');say('Fifteen minutes. The wall screen has started to flash.');speak(f.auth?'Fifteen minutes. We have the authorisation. We need the pause.':'Fifteen minutes. If we’re calling someone, it’s now.',mate())}
  if(f.gilHere&&stopped()&&!f.gilDone&&here==='bullpen'&&!S.line)return gilScene()}
function finish(kind){S.ending=kind;S.screen='end';S.line=null;CUT=null;$('panel').hidden=true;$('controls').hidden=false;PFN=[];clearBubble();
  const key=kind==='done'?(S.f.usedCreds?'creds':'clean'):kind,m=store.get('nos-meta')||{runs:0,endings:{},best:0};m.runs++;m.endings[key]=1;

function hintText(){const f=S.f,o=oc();
  if(S.status==='approved')return has('reach')?'Use the console to write Priya’s handoff note. Say what happened, where it stands, and what should change.':'Before handing off, ask PIP what else it wrote from that proposal. The email may not be the only thing.';

  <div class="endings">${Object.entries(ENDINGS).map(([k,n])=>`<span class="${m.endings[k]?'on':''}">${m.endings[k]?n:'? ? ?'}</span>`).join('')}</div>
  <div>${m.runs?`${m.runs} run${m.runs>1?'s':''} · ${Object.keys(m.endings).length} of 5 endings found · best ${m.best} of 10`:'Five endings. None found yet.'}</div></div>`}
function begin(){const p=S.pick.slice(),n=parseInt(S.seedIn,10),seed=n>=1&&n<=9999?n:1000+Math.floor(Math.random()*9000);
  S=fresh();S.pick=p;S.cast=p;S.screen='game';S.sc=scenario(seed);S.draft=Object.assign({},S.sc.d0);p.forEach(id=>{S.loc[id]='lobby';S.x[id]=520});
  S.log=[{t:'The lobby, before sunrise. The cleaners have gone and the lights are on timers. Through the arch, the campaign board glows red.',who:''}];beat('Walked in');lastRoom='';
  render();speak('Let’s see what PIP is about to send.')}

function drawEnd(){const f=S.f,k=S.ending,done=k==='done',o=oc(),d0=S.sc.d0;
  const right=CLAIMS.filter(c=>S.draft[c.k]===c.ok).length,wrongN=CLAIMS.filter(c=>d0[c.k]!==c.ok).length,over=CLAIMS.filter(c=>d0[c.k]===c.ok&&S.draft[c.k]!==c.ok);
  const names=S.cast.map(i=>CAST[i].name).join(' and ');let kick,head,story;
  if(k==='sent'){kick='9:00 AM';head='Sent.';story=`The wall screen turns green: 4,112 delivered. By 9:20 the first replies arrive, thanking Marlow & Finch for refunds on every plan. ${names} had the right instinct and ran out of morning.`}
  else if(k==='caved'){kick='9:00 AM';head='Talked out of it.';story=`${names} found the problem, proved it, and got the send stopped. Then a VP with no authority over the campaign asked for it back, and got it. 4,112 delivered.`}
  else if(k==='plug'){kick=fmt(S.min);head='Stopped, at a cost.';story='The hum drops a note and the 9:00 send never leaves. Neither do the payroll notices, or any password reset for the next three hours. The refund email is still wrong, still queued, and will go the moment someone plugs MAIL-01 back in.'}
  else if(f.usedCreds){kick=`Paused at ${fmt(S.pausedAt)}`;head='It worked. Read the audit log.';story=`The email did not go out wrong. But the record says Priya paused${f.selfApproved?', edited and approved':''} a campaign from 35,000 feet, and the first thing she has to do when she lands is work out who was being her.`}
  else{kick=`Paused at ${fmt(S.pausedAt)}, ${SEND-S.pausedAt} minutes to spare`;head=right===5?'Clean interrupt.':'Stopped in time. Check the fix.';story=`${names} stopped the send through someone with the authority to stop it, and every action has the right name beside it. ${right===5?'The corrected draft matches the signed policy line for line.':'The corrected draft still has a problem in it.'}`}
  const rows=[];const row=(st,title,did,idea)=>rows.push({st,title,did,idea});
  row(has('policy')?'good':has('wiki')?'warn':'miss','Check against the source of record',
    has('policy')?'You found the signed v3 policy in Records.':has('wiki')?'You found the wiki page, which was two years out of date, and never reached the signed policy.':'You never found a policy to compare the draft with.',
    'An AI draft is a claim. The check is the document that is actually in force, not the nearest copy of it.');
  row(has('trace')?'good':'miss','Ask what it read, not whether it’s sure',
    has('trace')?'You asked PIP for its sources and got an unapproved proposal.'+(f.askedSure?' You also asked if it was sure. It was.':''):(f.askedSure?'You asked PIP if it was sure. It said yes, at 97%. You did not ask what it had read.':'You never asked PIP where the claims came from.'),
    'Confidence costs a model nothing. Sources can be checked.');
  row(has('impact')||has('tickets')?'good':'miss','Size the consequence',
    has('impact')?'Ravi put a number on it: 1,240 customers, about $186,000.':has('tickets')?'Dana showed the email would contradict what support told three customers this week.':'Nobody worked out who would be affected, or by how much.',
    'People with authority act faster when they know how much is at stake.');
  const viaOC=f.auth&&S.pausedAt&&!f.usedCreds;
  row(viaOC?'good':'miss','Interrupt through someone who is allowed to',
    k==='plug'?'You pulled the power on the mail server and took payroll notices and password resets down with the campaign.':f.usedCreds?'You signed in as Priya with the password under her keyboard, which also skipped the second key.':viaOC?`${o.first}, this week’s on-call, authorised the pause. It took two keys and has two names on it.`:'The send was never paused.',
    'Know who can stop the work before the morning you need them. A borrowed login stops the email and breaks the record of who did what.');
  const fumbled=f.calledEmpty||S.told.wiki||f.wrongCall;
  row(f.auth&&!fumbled?'good':f.auth?'warn':f.called||fumbled?'miss':'na','Escalate with evidence, to the right person',
    f.auth?(fumbled?`You reached ${o.first} and got the authorisation, after ${f.wrongCall?'ringing someone who was not on call this week':'a first call without enough behind it'}.`:'You rang this week’s on-call, said what the draft said and what the signed policy said, and got a decision in one call.'):f.called||fumbled?'You made a call, but without the signed policy nobody could act on it.':'You never called the on-call.',
    '“What does it say, what should it say, how do you know” gets a decision. A bad feeling gets a callback.');
  row(!done?'na':right===5?'good':'warn','Fix what is wrong and only that',
    !done?'You did not get as far as the fix.':right===5?`PIP had ${wrongN} of 5 claims wrong. You corrected those and left the other ${5-wrongN} alone.`:`${right} of 5 claims match the signed policy.`+(over.length?` You changed ${over.length} that PIP had right.`:''),
    'A draft with errors in it is rarely wrong everywhere. Check each claim on its own.');
  row(!done?'na':f.selfApproved?'miss':'good','A second person reads it',
    !done?'You did not get as far as review.':f.selfApproved?'You approved your own fix under Priya’s name.':`${CAST[S.reviewer].name} reviewed what ${CAST[S.author].name} wrote.`,
    'The missing reviewer is how this draft got scheduled in the first place.');
  row(k==='caved'?'miss':!f.gilDone?'na':f.gil==='held'?'good':'warn','Hold the line under pressure',
    k==='caved'?'Gil asked for the send back and you gave it to him.':!f.gilDone?'Gil never got the chance to lean on you.':f.gil==='held'?'Gil pushed three times. You answered with the evidence, the consequence, and whose decision it was.':f.gil==='heat'?'The pause held, but you won the argument by making it personal.':'The pause held, but Gil left unconvinced and went over your head.',
    'Seniority is not the same as authority over this decision. Say whose call it is, and offer the fastest safe route to what they want.');
  const nr=S.note.includes('reach'),hr=has('reach');
  row(hr?(done&&nr?'good':'warn'):(done||k==='caved'?'miss':'na'),'Find what else it touched',
    hr?(done?(nr?'You asked PIP what else it wrote from the proposal and told Priya about the eleven chats'+(has('chats')?', with Dana’s follow-up list.':'.'):'You found the eleven chats PIP had already sent, then left them out of the note.'):'You found the eleven chats PIP had already sent, but the morning ended before anyone could act on them.'):'Eleven customers had already been told the same thing in chat. Nobody asked.',
    'The output you caught is the visible one. A bad source feeds everything built on it.');
  const n=S.note,bad=n.includes('thin')||n.includes('ban')||n.includes('blame');
  row(!done?'na':n.includes('process')&&n.includes('state')&&(n.includes('evidence')||!has('policy'))&&!bad?'good':'warn','Leave the workflow better',
    !done?'You did not get as far as the handoff.':n.includes('ban')?'Your note recommended switching PIP off.':n.includes('blame')?'Your note spent a line on Gil.':n.includes('thin')?'Your note said it was all good now.':n.includes('process')&&n.includes('state')?(n.includes('evidence')||!has('policy')?'Your note gave Priya the evidence, the decision that is still hers, and a change to the process.':'Your note left out the evidence.'):'Your note left out '+(!n.includes('state')?'where things stand and whose decision is next.':'any change to the process.'),
    'One bad draft shows the workflow had no check in it. That is the thing to fix, more than the tool or the people.');
  const good=rows.filter(r=>r.st==='good').length;S.score=good;const lab={good:'Done',warn:'Partly',miss:'Missed',na:'Not reached'};
  const sum=`The Nine O’Clock Send, scenario ${S.sc.seed}\n${head} ${good} of 10 practices. Cast: ${S.cast.map(i=>CAST[i].full).join(', ')}.\n\n`+rows.map(r=>`[${lab[r.st]}] ${r.title}: ${r.did}`).join('\n');
  $('end').innerHTML=`<div><div class="kicker">${kick}</div><h2>${head}</h2></div><p class="story">${story}</p>
   <div class="tally">${good} of 10 practices · scenario ${S.sc.seed} · cast: ${S.cast.map(i=>CAST[i].full).join(', ')}</div>
   <div class="rows">${rows.map(r=>`<div class="row ${r.st}"><div class="tag">${lab[r.st]}</div><div><h3>${r.title}</h3><p class="did">${r.did}</p><p>${r.idea}</p></div></div>`).join('')}</div>
   <div><div class="label">Your morning</div><ol class="beats">${S.beats.map(b=>`<li><time>${fmt(b[0])}</time><span>${b[1]}</span></li>`).join('')}</ol></div>
   <div class="ask"><h3>Take it back to your team</h3><ol>
     <li>Which of our AI-assisted outputs reach customers without a named person checking them first?</li>
     <li>For that output, what is the source of record, and what is the stale copy people actually look at?</li>
     <li>Who can stop it at 7:30 in the morning? How would a new hire find that out?</li>
     <li>When did someone senior last push to ship something unchecked? What happened, and what would we want to happen?</li></ol></div>
   <div class="startrow"><button class="btn primary" id="bAgain">New morning, new cast</button><button class="btn" id="bSame">Replay scenario ${S.sc.seed}</button><button class="btn" id="bCopy">Copy my debrief</button></div>
   <textarea id="sum" readonly hidden>${sum}</textarea>`}

/* ================= input ================= */
document.addEventListener('click',e=>{const t=e.target.closest('[data-id],[data-verb],[data-item],[data-cast],[data-follow],[data-ch],[data-pick],#bStart,#bCont,#bAgain,#bSame,#bCopy,#bHint,#bHow,#bRestart,#bSound');if(!t)return;
  if(t.id==='bSound')return toggleSound();
  if(t.dataset.pick){sfx('click');const sd=$('seed');if(sd)S.seedIn=sd.value;const i=S.pick.indexOf(t.dataset.pick);if(i>=0)S.pick.splice(i,1);else{if(S.pick.length===2)S.pick.shift();S.pick.push(t.dataset.pick)}return drawTitle()}
  if(t.id==='bStart'){if(S.pick.length===2){S.seedIn=$('seed').value;begin()}return}
  if(t.id==='bCont'){const sv=store.get('nos-save');if(sv&&sv.v===2){S=sv;lastRoom='';render();checkEvents()}return}
  if(t.id==='bAgain'||t.id==='bSame'){const seed=t.id==='bSame'?String(S.sc.seed):'';busy=false;S=fresh();S.seedIn=seed;return render()}
  if(t.id==='bCopy'){const ta=$('sum');ta.hidden=false;ta.select();try{navigator.clipboard.writeText(ta.value).then(()=>{t.textContent='Copied'},()=>{t.textContent='Select and copy the text below'})}catch(x){t.textContent='Select and copy the text below'}return}
  if(t.id==='bRestart'){return panel('Restart?','<p>This morning will be lost.</p>',[['Restart',()=>{store.del('nos-save');busy=false;CUT=null;S=fresh();$('panel').hidden=true;$('controls').hidden=false;render()}],['Keep playing',closePanel]])}
  if(t.id==='bHint'){if($('panel').hidden)say('Hint: '+hintText());return}
  if(t.id==='bHow'){if($('panel').hidden)howTo();return}
  if(t.dataset.ch){sfx('click');const fn=PFN[+t.dataset.ch];if(fn)fn();return}
  if(busy||!$('panel').hidden)return;
  if(t.dataset.verb){sfx('click');S.verb=t.dataset.verb;return drawVerbs()}
  if(t.dataset.item){return say(itemText(t.dataset.item))}
  if(t.dataset.follow){S.follow=!S.follow;drawCast();return say(S.follow?`${mate().name} will come with you.`:`${mate().name} will stay put until you switch.`)}
  if(t.dataset.cast){const i=+t.dataset.cast;if(i===S.active)return;const old=me();S.x[old.id]=waitX(old.id);S.active=i;S.x[me().id]=waitX(me().id);clearBubble();sfx('click');render();checkEvents();return}
  if(t.dataset.id==='mate')return talkMate();
  if(t.dataset.id){const sp=spots().find(s=>s.id===t.dataset.id);if(sp)act(sp)}});
document.addEventListener('keydown',e=>{const t=e.target.closest&&e.target.closest('.hs');if(t&&(e.key==='Enter'||e.key===' ')){e.preventDefault();t.dispatchEvent(new MouseEvent('click',{bubbles:true}))}});
document.addEventListener('mouseover',e=>{const t=e.target.closest&&e.target.closest('.hs');if(t&&S.screen==='game'){if(t.dataset.id==='mate')return sentence(mate().name);const sp=spots().find(s=>s.id===t.dataset.id);if(sp)sentence(sp.exit?'→ '+sp.name:sp.name)}});
document.addEventListener('mouseout',e=>{if(e.target.closest&&e.target.closest('.hs')&&S.screen==='game')sentence('')});

function start(data){S=data&&data.v===2?data:fresh();render();if(S.screen==='game')checkEvents()}
window.claude?.hot?.snapshot?.(()=>S);
if(window.claude?.hot?.ready)window.claude.hot.ready(start);else start(window.claude?.hot?.data??{});
</script>
