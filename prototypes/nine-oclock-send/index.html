<title>The Nine O'Clock Send</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Atkinson+Hyperlegible:wght@400;700&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
/* Layout: one column. Clock strip, the stage (a wide illustrated room), then a control deck
   under it that swaps between verbs + folder and a conversation panel. Single visual world:
   an office before sunrise, lit by one amber lamp. */
:root{
  color-scheme:dark;
  --night:#121829; --deck:#1a2238; --deck-2:#232d4a; --line:#36426b;
  --ink:#f3efe6; --ink-soft:#aab2cd; --lamp:#ffb44a; --lamp-ink:#2a1a00;
  --go:#62d8a6; --stop:#ff6f61; --pip:#8fd6ff;
  --display:'Bricolage Grotesque','Avenir Next','Segoe UI',sans-serif;
  --body:'Atkinson Hyperlegible','Segoe UI',system-ui,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--night);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;
  padding-block:14px 28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1000px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;line-height:1.1}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,.hs:focus-visible{outline:3px solid var(--lamp);outline-offset:2px}
.btn{background:var(--deck-2);border:1px solid var(--line);border-radius:8px;padding:9px 14px;text-align:left}
.btn:hover{border-color:var(--lamp)}
.btn.primary{background:var(--lamp);color:var(--lamp-ink);border-color:var(--lamp);font-weight:700}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.ghost{background:none;border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:14px;color:var(--ink-soft)}
.ghost:hover{color:var(--ink);border-color:var(--ink-soft)}

/* top strip */
.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px}
.top h1{font-size:22px;letter-spacing:-.01em;margin-right:auto}
.clock{font-family:var(--mono);font-weight:600;font-size:20px;font-variant-numeric:tabular-nums}
.chip{font-family:var(--mono);font-size:13px;padding:4px 10px;border-radius:999px;border:1px solid var(--line);color:var(--ink-soft)}
.chip.warn{color:var(--lamp);border-color:var(--lamp)}
.chip.hot{color:var(--stop);border-color:var(--stop)}
.chip.ok{color:var(--go);border-color:var(--go)}

/* title screen */
.intro{display:grid;gap:22px}
.intro .lede{font-size:clamp(30px,6vw,52px);font-weight:700;letter-spacing:-.02em;max-width:17ch}
.intro .lede em{font-style:normal;color:var(--lamp)}
.intro p{max-width:62ch;margin:0;color:var(--ink-soft)}
.intro p strong{color:var(--ink)}
.castpick{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}
.card{display:grid;grid-template-columns:56px 1fr;gap:10px;align-items:center;background:var(--deck);border:1px solid var(--line);border-radius:10px;padding:10px 12px;text-align:left}
.card svg{width:56px;height:84px}
.card b{font-family:var(--display);font-size:17px;display:block}
.card span{font-size:14px;color:var(--ink-soft);display:block}
.card[aria-pressed="true"]{border-color:var(--lamp);background:var(--deck-2);box-shadow:inset 0 0 0 1px var(--lamp)}
.startrow{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.how{font-size:14px;color:var(--ink-soft);border-top:1px solid var(--line);padding-top:14px;max-width:70ch}

/* stage */
.stage{border:1px solid var(--line);border-radius:10px;overflow-x:auto;background:#0d1220}
.stage svg{display:block;width:100%;min-width:640px;height:auto;font-family:var(--mono)}
.hs{cursor:pointer;outline:none}
.hs .ring{fill:transparent;stroke:transparent;stroke-width:2;stroke-dasharray:5 4;pointer-events:all}
.hs:hover .ring,.hs:focus-visible .ring{stroke:var(--lamp)}
.fig{transition:transform .36s ease;pointer-events:none}
@media (prefers-reduced-motion:reduce){.fig{transition:none}}
.roomname{font-family:var(--mono);font-size:13px;color:var(--ink-soft);letter-spacing:.08em;text-transform:uppercase}
.stagehead{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between}
.cast{display:flex;gap:8px;flex-wrap:wrap}
.cast button{display:flex;align-items:center;gap:8px;background:var(--deck);border:1px solid var(--line);border-radius:999px;padding:3px 12px 3px 4px;font-size:14px}
.cast button i{width:22px;height:22px;border-radius:50%;display:block}
.cast button[aria-pressed="true"]{border-color:var(--lamp);color:var(--lamp)}
.cast button small{color:var(--ink-soft);font-size:12px}

/* narration */
.talk{min-height:92px;background:var(--deck);border:1px solid var(--line);border-radius:10px;padding:10px 14px;display:flex;flex-direction:column;justify-content:flex-end;gap:4px}
.talk p{margin:0;max-width:78ch}
.talk p.old{color:var(--ink-soft);font-size:14px;opacity:.75}
.talk b{font-family:var(--display);color:var(--lamp);font-weight:700}
.talk .got{color:var(--go);font-family:var(--mono);font-size:13px}

/* deck */
.sentence{font-family:var(--mono);font-size:14px;color:var(--lamp);min-height:21px}
.deck{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:12px}
@media (max-width:640px){.deck{grid-template-columns:1fr}}
.verbs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;align-content:start}
.verbs button{background:var(--deck);border:1px solid var(--line);border-radius:8px;padding:10px 6px;font-family:var(--display);font-weight:700;font-size:16px}
.verbs button[aria-pressed="true"]{background:var(--lamp);color:var(--lamp-ink);border-color:var(--lamp)}
.folder{background:var(--deck);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0}
.folder h3{font-family:var(--mono);font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:8px}
.folder .items{display:flex;flex-wrap:wrap;gap:6px}
.folder .items button{background:var(--deck-2);border:1px solid var(--line);border-radius:6px;padding:5px 10px;font-size:14px}
.folder .items button:hover{border-color:var(--lamp)}
.folder .none{color:var(--ink-soft);font-size:14px}

/* conversation / console panel */
.panel{background:var(--deck);border:1px solid var(--lamp);border-radius:10px;padding:14px 16px;display:grid;gap:12px}
.panel h3{font-size:18px}
.panel .body{max-width:74ch}
.panel .body p{margin:0 0 8px}
.panel .choices{display:grid;gap:6px}
.screen{font-family:var(--mono);font-size:14px;background:#0c1120;border:1px solid var(--line);border-radius:8px;padding:12px 14px;line-height:1.6;overflow-wrap:anywhere}
.screen mark{background:none;color:var(--lamp);border-bottom:1px dashed var(--lamp)}
.cols{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:14px}
@media (max-width:720px){.cols{grid-template-columns:1fr}}
fieldset{border:1px solid var(--line);border-radius:8px;padding:8px 12px;margin:0 0 8px;min-width:0}
legend{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft);padding:0 6px}
fieldset label{display:flex;gap:8px;align-items:baseline;padding:3px 0;font-size:15px}
.evlist{font-size:14px;color:var(--ink-soft);display:grid;gap:8px;align-content:start}
.evlist b{color:var(--ink);font-family:var(--display)}

/* debrief */
.end{display:grid;gap:18px}
.end .kicker{font-family:var(--mono);font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--lamp)}
.end h2{font-size:clamp(28px,5vw,44px);letter-spacing:-.02em}
.end .story{max-width:66ch;color:var(--ink-soft);margin:0}
.rows{display:grid;gap:8px}
.row{display:grid;grid-template-columns:88px minmax(0,1fr);gap:12px;background:var(--deck);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.row .tag{font-family:var(--mono);font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding-top:3px}
.row.good .tag{color:var(--go)} .row.warn .tag{color:var(--lamp)} .row.miss .tag{color:var(--stop)} .row.na .tag{color:var(--ink-soft)}
.row h3{font-size:17px;margin-bottom:2px}
.row p{margin:0;font-size:15px;color:var(--ink-soft)}
.row p.did{color:var(--ink)}
@media (max-width:480px){.row{grid-template-columns:1fr;gap:4px}}
.tally{font-family:var(--mono);font-size:15px}
</style>

<div class="wrap">
  <div class="top">
    <h1>The Nine O'Clock Send</h1>
    <span class="clock" id="clock" hidden></span>
    <span class="chip" id="chip" hidden></span>
    <button class="ghost" id="bHint" hidden>Hint</button>
    <button class="ghost" id="bHow" hidden>How to play</button>
    <button class="ghost" id="bRestart" hidden>Restart</button>
  </div>

  <section id="title" class="intro"></section>

  <section id="game" hidden style="display:grid;gap:10px">
    <div class="stagehead">
      <span class="roomname" id="roomname"></span>
      <div class="cast" id="cast"></div>
    </div>
    <div class="stage" id="stage"></div>
    <div class="talk" id="talk" aria-live="polite"></div>
    <div id="controls">
      <div class="sentence" id="sentence"></div>
      <div class="deck">
        <div class="verbs" id="verbs"></div>
        <div class="folder"><h3>Team folder</h3><div class="items" id="items"></div></div>
      </div>
    </div>
    <div class="panel" id="panel" hidden></div>
  </section>

  <section id="end" class="end" hidden></section>
</div>

<script>
'use strict';
/* ---------- data ---------- */
const CAST={
  dana:{id:'dana',name:'Dana',full:'Dana Okafor',role:'Support lead',skill:'Can open the support queue.',shirt:'#e0704f',legs:'#2b3350',skin:'#7a4a32',hair:'#1c1418'},
  ravi:{id:'ravi',name:'Ravi',full:'Ravi Menon',role:'Data analyst',skill:'Can query the billing data.',shirt:'#4fa3c7',legs:'#3a3148',skin:'#b07a52',hair:'#15131c'},
  lucia:{id:'lucia',name:'Lucía',full:'Lucía Ferreira',role:'Compliance paralegal',skill:'Carries a Records key. Knows the policy book.',shirt:'#b98ad6',legs:'#27304a',skin:'#d9a27c',hair:'#5a2e22'},
  theo:{id:'theo',name:'Theo',full:'Theo Brandt',role:'IT operations',skill:'Badge opens the server closet. Reads audit logs.',shirt:'#8fbf6a',legs:'#2a2f3d',skin:'#e6b99a',hair:'#c9682f'}
};
const ITEMS={
  wiki:['Wiki page (v2)','Intranet wiki: Refund Policy v2, section 2.1. 45 days, all plans, $14 processing credit. The page was last edited two years ago.'],
  policy:['Signed policy (v3)','Policy of record: Refund Policy v3, section 4.2, signed in April. Full refund within 30 days, Monthly plans only. Annual plans receive a prorated credit. The $14 processing credit is unchanged.'],
  trace:['PIP’s sources','PIP’s source list: (1) “Refund proposal DRAFT, not approved” from the shared drive. (2) “Policy 7.3”: no document found.'],
  impact:['Billing query','Billing query: 4,112 recipients. 1,240 are on Annual plans. Promising them full refunds is about $186,000 of exposure.'],
  tickets:['Support tickets','Support queue: three tickets this week where agents quoted 30 days, Monthly only. The email would contradict them.'],
  sticky:['Sticky note','From under Priya’s keyboard: her username and password, in her handwriting.'],
  key:['Records key','Signed out at the lobby desk, in your name.'],
  roster:['On-call rota','On-call this week: Marcus Bell, operations, ext. 4417. On-call has pause authority over scheduled sends.'],
  handoff:['Priya’s note','“Out until 10, in the air. PIP has the refund campaign queued for 9. If anything is on fire, ops on-call can pause it. Rota is in the kitchen. Please don’t edit campaigns under my login. P.”']
};
const CLAIMS=[
  {k:'window',label:'Refund window',opts:['60 days','45 days','30 days'],ok:2},
  {k:'plans',label:'Which plans',opts:['all plans, including Annual','Monthly plans (Annual plans receive a prorated credit)','Annual plans only'],ok:1},
  {k:'credit',label:'Processing credit',opts:['A $14 processing credit is applied automatically.','A $40 processing credit is applied automatically.','(remove this sentence)'],ok:0},
  {k:'cite',label:'Policy reference',opts:['Policy 7.3','Policy 4.2','Policy 2.1'],ok:1}
];
const VERBS=[['look','Look at'],['use','Use'],['take','Take'],['open','Open'],['talk','Talk to']];
const START=450, SEND=540;

/* ---------- state ---------- */
let S, busy=false, PFN=[];
const fresh=()=>({screen:'title',pick:[],cast:[],active:0,loc:{},x:{},min:START,verb:'look',inv:[],f:{},told:{},
  draft:{window:0,plans:0,credit:0,cite:0},status:'live',author:null,reviewer:null,note:null,ending:null,log:[]});
const $=id=>document.getElementById(id);
const me=()=>CAST[S.cast[S.active]];
const has=i=>S.inv.includes(i);
const onTeam=i=>S.cast.includes(i);
const fmt=m=>`${Math.floor(m/60)}:${String(m%60).padStart(2,'0')} AM`;
const stopped=()=>S.status!=='live';

function say(t,who){S.log.push({t,who:who||''});if(S.log.length>30)S.log.shift();drawTalk()}
function speak(t){say(t,me().name)}
function give(i){if(has(i))return false;S.inv.push(i);S.log.push({got:ITEMS[i][0]});drawTalk();drawItems();return true}
function tick(n){S.min+=n;drawTop();if(!stopped()&&S.min>=SEND){finish('sent');return true}return false}

/* ---------- drawing helpers ---------- */
const R=(x,y,w,h,f,o='')=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${f}" ${o}/>`;
const Ci=(x,y,r,f,o='')=>`<circle cx="${x}" cy="${y}" r="${r}" fill="${f}" ${o}/>`;
const Tx=(x,y,s,f,z=12,o='')=>`<text x="${x}" y="${y}" fill="${f}" font-size="${z}" ${o}>${s}</text>`;
const lerp=(a,b,t)=>{const p=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16)),A=p(a),B=p(b);
  return '#'+A.map((v,i)=>Math.round(v+(B[i]-v)*t).toString(16).padStart(2,'0')).join('')};
const dawn=()=>Math.max(0,Math.min(1,(S.min-START)/(SEND-START)));
function defs(){const t=dawn();return `<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${lerp('#18203f','#5a79b8',t)}"/><stop offset="1" stop-color="${lerp('#4a3a5e','#ffc591',t)}"/></linearGradient>
  <radialGradient id="glow"><stop offset="0" stop-color="#ffb44a" stop-opacity=".5"/><stop offset="1" stop-color="#ffb44a" stop-opacity="0"/></radialGradient>
  <radialGradient id="cool"><stop offset="0" stop-color="#8fd6ff" stop-opacity=".45"/><stop offset="1" stop-color="#8fd6ff" stop-opacity="0"/></radialGradient></defs>`}
function shell(wall,floor){return R(0,0,960,292,wall)+R(0,292,960,128,floor)+R(0,286,960,8,'#00000033')+
  [0,1,2,3,4,5,6,7].map(i=>`<path d="M${i*140-40} 420 L${i*90+150} 294" stroke="#ffffff0d" stroke-width="2"/>`).join('')}
function win(x,y,w,h,panes=2){const t=dawn(),sy=y+h-10-t*h*.55;let s=R(x-6,y-6,w+12,h+12,'#151b30','rx="4"')+`<clipPath id="w${x}"><rect x="${x}" y="${y}" width="${w}" height="${h}"/></clipPath><g clip-path="url(#w${x})">`+R(x,y,w,h,'url(#sky)')+
  Ci(x+w*.7,sy,22,lerp('#ffd9a0','#fff1c9',t),`opacity="${.25+t*.75}"`);
  for(let i=0;i<Math.ceil(w/46);i++){const bh=30+((i*37+x)%5)*16;s+=R(x+i*46,y+h-bh,40,bh,lerp('#0f1428','#2c3558',t));
    s+=R(x+i*46+8,y+h-bh+10,6,6,'#ffcf7a',`opacity="${(i%3?0.7:0.2)*(1-t*.6)}"`)}
  s+='</g>';for(let i=1;i<panes;i++)s+=R(x+w*i/panes-3,y,6,h,'#151b30');return s}
const lamp=(x,y)=>Ci(x,y,120,'url(#glow)')+R(x-3,y-70,6,70,'#151b30')+`<path d="M${x-26} ${y+6} L${x+26} ${y+6} L${x+16} ${y-18} L${x-16} ${y-18}Z" fill="#ffb44a"/>`;
const arrow=(x,y,dir,label)=>{const d=dir<0?`M${x+16} ${y-18} L${x-8} ${y} L${x+16} ${y+18}`:`M${x-16} ${y-18} L${x+8} ${y} L${x-16} ${y+18}`;
  return Ci(x,y,26,'#0d1220','opacity=".75"')+`<path d="${d}" fill="none" stroke="#ffb44a" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>`+
  Tx(x,y+46,label,'#f3efe6',12,'text-anchor="middle"')};
const door=(x,y,w,h,label,col='#5b4636')=>R(x-8,y-8,w+16,h+8,'#151b30')+R(x,y,w,h,col,'rx="2"')+R(x+10,y+12,w-20,h*.38,'#00000022','rx="2"')+R(x+10,y+h*.52,w-20,h*.38,'#00000022','rx="2"')+
  Ci(x+w-14,y+h*.55,5,'#e0c080')+R(x+w/2-44,y-34,88,20,'#f3efe6','rx="3"')+Tx(x+w/2,y-20,label,'#1a2238',11,'text-anchor="middle" font-weight="600"');
const desk=(x,y,w)=>R(x,y,w,12,'#a8734a','rx="3"')+R(x+8,y+12,w-16,84,'#7a5236')+R(x+8,y+12,w-16,6,'#00000033');
const monitor=(x,y,w,h,scr)=>R(x,y,w,h,'#10162a','rx="5"')+R(x+5,y+5,w-10,h-12,scr,'rx="3"')+R(x+w/2-6,y+h,12,10,'#10162a')+R(x+w/2-22,y+h+8,44,5,'#10162a','rx="2"');

function fig(c,x,isMe){const y=392,sk=c.skin;let hairB='',hairF='',extra='';
  if(c.id==='dana'){hairB=Ci(0,y-146,27,c.hair);hairF=`<path d="M-19 ${y-142} A19 19 0 0 1 19 ${y-142} L19 ${y-148} L-19 ${y-148}Z" fill="${c.hair}"/>`;extra=R(-10,y-118,20,5,'#f3efe6','rx="2"')}
  if(c.id==='ravi'){hairF=`<path d="M-20 ${y-138} A20 21 0 0 1 20 ${y-138} L17 ${y-146} L-17 ${y-146}Z" fill="${c.hair}"/>`;
    extra=`<circle cx="-8" cy="${y-137}" r="6" fill="none" stroke="#f3efe6" stroke-width="2"/><circle cx="8" cy="${y-137}" r="6" fill="none" stroke="#f3efe6" stroke-width="2"/>`}
  if(c.id==='lucia'){hairB=R(-22,y-152,44,58,c.hair,'rx="18"');hairF=`<path d="M-19 ${y-142} A19 19 0 0 1 19 ${y-142} L10 ${y-152} L-14 ${y-150}Z" fill="${c.hair}"/>`;extra=R(-3,y-112,6,30,'#f3efe6','rx="2"')+Ci(12,y-72,4,'#e0c080')}
  if(c.id==='theo'){hairF=`<path d="M-21 ${y-140} A21 22 0 0 1 21 ${y-140}Z" fill="#2f6e7a"/>`+R(-21,y-143,42,7,'#3c8a99','rx="3"')+`<path d="M-14 ${y-128} Q0 ${y-112} 14 ${y-128} L14 ${y-124} Q0 ${y-108} -14 ${y-124}Z" fill="${c.hair}"/>`;
    extra=R(-20,y-66,14,18,'#f3efe6','rx="2"')+`<path d="M-12 ${y-116} L-13 ${y-66}" stroke="#f3efe6" stroke-width="2"/>`}
  return `<g class="fig" ${isMe?'id="me"':''} style="transform:translate(${x}px,0)" opacity="${isMe?1:.72}">
  <ellipse cx="0" cy="${y}" rx="30" ry="7" fill="#000" opacity=".3"/>
  ${R(-17,y-54,14,52,c.legs,'rx="5"')+R(3,y-54,14,52,c.legs,'rx="5"')+R(-20,y-6,19,8,'#10162a','rx="4"')+R(1,y-6,19,8,'#10162a','rx="4"')}
  ${R(-33,y-112,13,54,c.shirt,'rx="6"')+R(20,y-112,13,54,c.shirt,'rx="6"')+Ci(-26,y-56,7,sk)+Ci(27,y-56,7,sk)}
  ${R(-24,y-118,48,74,c.shirt,'rx="14"')+R(-6,y-126,12,12,sk)}
  ${hairB+Ci(0,y-138,19,sk)+hairF+(c.id==='ravi'?'':Ci(-7,y-137,2.4,'#1a1420')+Ci(7,y-137,2.4,'#1a1420'))+extra}
  ${isMe?`<path d="M-9 ${y-186} L9 ${y-186} L0 ${y-174}Z" fill="#ffb44a"/>`:''}</g>`}

/* ---------- rooms ---------- */
const ROOMS={
lobby:{name:'Lobby',bg:()=>shell('#2a3558','#232b47')+win(40,40,470,190,3)+Tx(756,58,'MARLOW &amp; FINCH','#f3efe6',15,'text-anchor="middle" font-weight="600" letter-spacing="3"')+lamp(660,120),
 spots:[

/* ---------- object logic ---------- */
function takeKey(c){
  if(c.id==='lucia')return speak('I have my own Records key on my lanyard. This one can stay.');
  if(has('key'))return say('The RECORDS hook is empty. You have the key.');
  if(!S.f.signed)return say('SIGN THE LOG FIRST, says the lid. The log is right there on the desk.');
  give('key');say('You lift the Records key off its hook. It is signed out in your name, so anyone can see who has it.')}
function kiosk(c){give('wiki');
  say('The intranet wiki. “Refund Policy v2, section 2.1: refunds within 45 days, all plans, $14 processing credit.” A grey banner: last edited two years ago.');
  if(c.id==='lucia')speak('Version two. That was superseded in April. The signed v3 is in Records.');
  else speak('Different from the email. But two years old. Is this the current policy?')}
function readNote(){give('handoff');S.f.knowsPriya=1;say('Priya’s handwriting. “Out until 10, in the air. PIP has the refund campaign queued for 9. If anything is on fire, ops on-call can pause it. Rota is in the kitchen. Please don’t edit campaigns under my login. P.”')}
function stickyTake(){if(has('sticky'))return say('You already have the note.');if(!S.f.stickySeen)return say('The keyboard is plugged in and going nowhere.');
  give('sticky');render();say('A sticky note with Priya’s username and password. It would get you into the scheduler as her. You pocket it, for now.')}
function roster(t){S.f.onCall=1;give('roster');say(t)}
function enterRecords(c){if(c.id==='lucia'||has('key')){say(c.id==='lucia'?'Lucía’s key turns first time.':'The signed-out key turns in the lock.');return go('records',720)}
  say('Locked. The plaque says Records keys are signed out at the lobby desk.'+(onTeam('lucia')?' Lucía carries one of her own.':''))}
function enterServer(c){if(c.id==='theo'){say('Theo’s badge. Green light, heavy click.');return go('server',160)}
  say('The reader blinks red. Not your badge, not your closet.'+(onTeam('theo')?' Theo’s badge would open it.':''))}
function openCab(){if(S.f.cabOpen)return say('The POLICY drawer is already open. The v3 binder is sitting on top.');S.f.cabOpen=1;render();say('The POLICY drawer slides out. You lift the newest binder onto the cabinet: Refund Policy v3, with signatures.')}
function binder(c){const first=give('policy');
  say('Refund Policy v3, section 4.2, signed in April. “Full refund within 30 days of purchase, Monthly plans only. Annual plans receive a prorated credit. The $14 processing credit is unchanged.”');
  if(first)speak(c.id==='lucia'?'Signed, dated, current. This is the one that counts.':'Signed and dated. This is the source, not a copy of a copy.')}
function analytics(c){if(c.id!=='ravi')return say('It wants a billing-data login. You do not have one, and guessing is not a plan.'+(onTeam('ravi')?' Ravi does.':''));
  const first=give('impact');if(first)tick(2);say('Ravi runs the recipient list against billing. 4,112 recipients. 1,240 on Annual plans. If each claimed the refund the email promises, that is about $186,000.');
  if(first)speak('So it is not a typo. It is a six-figure promise we cannot keep.')}
function support(c){if(c.id!=='dana')return say('The queue is locked to support logins.'+(onTeam('dana')?' Dana has one.':''));
  const first=give('tickets');if(first)tick(2);say('Dana filters the queue for “refund”. Three tickets this week, and in each one an agent quoted 30 days, Monthly plans only.');
  if(first)speak('My team has been telling customers the opposite of this email all week.')}
function audit(){S.f.onCall=1;give('roster');say('The scheduler’s audit log. “Campaign: Refund Policy Update. Pause authority: owner P. Raman; ops on-call M. Bell, ext. 4417.” Every pause, edit and login is recorded here with a name next to it.')}
function plug(){panel('The power cable','<p>MAIL-01 sends everything: the 9:00 campaign, this morning’s payroll notices, every password reset. Pulling the cable stops all of it, and nobody will know why until someone finds the cable.</p>',
  [['Pull it',()=>{closePanel();finish('plug')}],['Leave it alone',()=>{closePanel();speak('No. There is a pause button somewhere, and somebody who is allowed to press it.')}]])}

function pip(){const q=(line)=>panel('PIP','<p class="screen">'+line+'</p>',[
  ['“Is the refund email accurate?”',()=>q('Yes! I am confident the Refund Policy Update is accurate and ready to send. Confidence: 97%.')],
  ['“Are you sure?”',()=>{S.f.askedSure=1;q('Absolutely. I double-checked. The refund window is 60 days on all plans, per Policy 7.3. Is there anything else I can help with?')}],
  ['“Show me the sources you used.”',()=>{const first=give('trace');q('Sources used:<br>1. “Refund proposal DRAFT, not approved” (shared drive, March)<br>2. Policy 7.3 (no document found)');
     if(first){if(me().id==='lucia')speak('There is no Policy 7.3. The book stops at section 6.');else speak('An unapproved draft, and a policy number with no document behind it.')}}],
  ['Step away',closePanel]]);
  q('Good morning! I am PIP. I drafted this morning’s campaign. How can I help?')}

function phone(){const ch=[];
  if(S.f.knowsPriya)ch.push(['Call Priya Raman',()=>{closePanel();if(tick(2))return;say('Straight to voicemail. “This is Priya. I’m travelling and back at ten.” The send is at nine.')}]);
  if(S.f.onCall)ch.push(['Call Marcus Bell, ops on-call, ext. 4417',()=>callMarcus()]);
  if(!ch.length)return say('You lift the handset and realise you do not know who to call. Who is allowed to stop a scheduled send?');
  ch.push(['Put the phone down',closePanel]);panel('Desk phone','<p>Internal directory.</p>',ch)}
function callMarcus(){if(S.f.auth)return panel('Marcus Bell, ops on-call','<p>“Pause is unlocked on the scheduler. Go and press it.”</p>',[['Hang up',closePanel]]);
  marcus('“Bell, ops on-call. It’s not even eight, so this is either very good or very bad. What’s wrong, and how do you know?”')}
function marcus(line){const ch=[],t=S.told,a=()=>S.f.auth;
  if(has('policy')&&!t.policy)ch.push(['“The draft promises 60 days on all plans. The signed policy, v3, says 30 days, Monthly only.”',()=>{t.policy=1;S.f.auth=1;marcus('“That’s specific, and it’s the signed copy. Good. I’m unlocking Pause on the scheduler for you now. Anything else I should pass on to Priya?”')}]);
  if(has('wiki')&&!has('policy')&&!t.wiki)ch.push(['“The draft says 60 days. The wiki says 45.”',()=>{t.wiki=1;if(tick(3))return;marcus('“The wiki? That page is two years stale. I’m not pausing a customer send on one unreliable source against another. Find the policy that’s actually in force.”')}]);
  if(has('trace')&&!t.trace)ch.push(['“PIP built it from an unapproved proposal, and it cites a Policy 7.3 that doesn’t exist.”',()=>{t.trace=1;marcus(a()?'“So it isn’t a typo. It read the wrong document. Priya will want that.”':'“That’s a bad smell. It isn’t proof the email is wrong. What does the actual policy say?”')}]);
  if(has('impact')&&!t.impact)ch.push(['“1,240 of the recipients are on Annual plans. That’s about $186,000 in refunds we’d be promising.”',()=>{t.impact=1;marcus(a()?'“That’s the number Priya will ask for first. Thank you.”':'“That’s how big it is if you’re right. Are you right? What does the signed policy say?”')}]);
  if(has('tickets')&&!t.tickets)ch.push(['“Support has told three customers this week it’s 30 days, Monthly only.”',()=>{t.tickets=1;marcus(a()?'“So the email would contradict our own agents. Noted.”':'“Then somebody is wrong, support or the email. Which one matches the signed policy?”')}]);
  if(!a())ch.push(['“PIP just seems off. I have a bad feeling about this one.”',()=>{S.f.calledEmpty=1;closePanel();if(tick(5))return;say('Marcus: “PIP has drafted forty campaigns. I can’t pause a customer send on a feeling. Call me back with what it says and what it should say.” He hangs up. Five minutes gone.')}]);
  ch.push([a()?'“That’s everything. Thanks, Marcus.”':'“Let me call you back.”',()=>{closePanel();if(a())say('Marcus: “One more thing. Don’t fix it under Priya’s name. Edit it, get a second person to check it, then hand it back to her.”')}]);
  panel('Phone: Marcus Bell, ops on-call','<p>'+line+'</p>',ch)}

/* ---------- console, editor, review ---------- */
function email(d,marked){const m=s=>marked?`<mark>${s}</mark>`:s;const cr=CLAIMS[2].opts[d.credit];
  return `Subject: Good news about refunds<br><br>Hi {first_name},<br><br>We’ve updated our refund policy. You can request a full refund within ${m(CLAIMS[0].opts[d.window])} of purchase on ${m(CLAIMS[1].opts[d.plans])}. ${d.credit===2?'':m(cr)+' '}Full details are in ${m(CLAIMS[3].opts[d.cite])}.<br><br>The Marlow &amp; Finch team`}
function evHTML(){const ev=['policy','wiki','trace','impact','tickets'].filter(has);
  return '<div class="evlist">'+(ev.length?ev.map(i=>`<div><b>${ITEMS[i][0]}</b><br>${ITEMS[i][1]}</div>`).join(''):'<div>The team folder has nothing to check this against yet.</div>')+'</div>'}
function openConsole(){const c=me(),ch=[];let st;
  if(S.status==='live')st=`Status: SCHEDULED, 9:00 AM. ${Math.max(0,SEND-S.min)} minutes.`;
  if(S.status==='paused')st='Status: PAUSED. Draft is unlocked for editing.';
  if(S.status==='submitted')st=`Status: PAUSED. Changes by ${CAST[S.author].name} are waiting for review.`;
  if(S.status==='approved')st=`Status: PAUSED. Changes by ${CAST[S.author].name}, reviewed by ${S.reviewer==='priya-login'?'“Priya Raman”':CAST[S.reviewer].name}. Ready to hand to the owner.`;
  ch.push(['Read the draft',()=>{S.f.seenDraft=1;panel('The draft','<div class="screen">'+email(S.draft,true)+'</div>',[['Back',openConsole]]);
    if(me().id==='lucia'&&S.status==='live'&&!S.f.luciaCite){S.f.luciaCite=1;speak('Policy 7.3? Our policy book stops at section 6.')}}]);
  if(S.status==='live'){
    ch.push(['Pause the send',()=>{if(!S.f.auth)return panel('Scheduler','<p class="screen">PAUSE requires the campaign owner or ops on-call. You are signed in as: guest (read-only).</p>',[['Back',openConsole]]);
      S.status='paused';S.pausedAt=S.min;closePanel();render();say(`Paused at ${fmt(S.min)}, under Marcus’s authorisation and your own name. The countdown on the wall screen stops.`);speak('It’s stopped. Now it has to be right.')}]);
    if(has('sticky'))ch.push(['Sign in as Priya, using the sticky note',()=>panel('Sign in as Priya?','<p>Her note on the desk says not to edit campaigns under her login. The audit log will show Priya pausing a campaign while she was on a plane.</p>',
      [['Sign in as her and pause the send',()=>{S.f.usedCreds=1;S.status='paused';S.pausedAt=S.min;closePanel();render();say(`Paused at ${fmt(S.min)}. As far as the system knows, Priya did it.`)}],['Don’t',openConsole]])]);
  }
  if(S.status==='paused')ch.push(['Edit the draft',editor]);
  if(S.status==='submitted'){
    if(c.id!==S.author)ch.push(['Review '+CAST[S.author].name+'’s changes',review]);
    else{ch.push(['Review the changes',()=>panel('Scheduler','<p class="screen">Reviewer must be someone other than the author ('+c.full+').</p><p>Your teammate did not write it. Switch to them and bring them to this console.</p>',[['Back',openConsole]])]);
      if(S.f.usedCreds)ch.push(['Approve it yourself, as Priya',()=>{S.f.selfApproved=1;S.status='approved';S.reviewer='priya-login';closePanel();render();say('Approved by “Priya Raman”. Nobody but you has read the fix.')}])}
  }
  if(S.status==='approved')ch.push(['Hand it back to Priya with a note',handoffNote]);
  ch.push(['Step away',closePanel]);
  panel('Campaign scheduler','<p class="screen">REFUND POLICY UPDATE · 4,112 recipients<br>Drafted by: PIP · Owner: P. Raman<br>'+st+'</p>',ch)}
function editor(){const d=S.draft;
  const form=CLAIMS.map(cl=>`<fieldset><legend>${cl.label}</legend>${cl.opts.map((o,i)=>`<label><input type="radio" name="c_${cl.k}" id="c_${cl.k}_${i}" value="${i}" ${d[cl.k]===i?'checked':''}> <span>${o}${i===0?' <small style="color:var(--ink-soft)">(as drafted)</small>':''}</span></label>`).join('')}</fieldset>`).join('');
  panel('Edit the draft','<p>Four claims. Change what the evidence says is wrong, and leave alone what is right.</p><div class="cols"><div>'+form+'</div>'+evHTML()+'</div>',
   [['Submit for review',()=>{read();S.status='submitted';S.author=me().id;closePanel();render();say('Submitted. The scheduler now wants a reviewer who is not the author.')},'primary'],['Save and step away',()=>{read();closePanel()}]]);
  function read(){CLAIMS.forEach(cl=>{const el=document.querySelector(`input[name="c_${cl.k}"]:checked`);if(el)d[cl.k]=+el.value})}}
function review(){panel('Review the changes','<p>Read it as if you had never seen it. Does every claim match the evidence?</p><div class="cols"><div class="screen">'+email(S.draft,true)+'</div>'+evHTML()+'</div>',
  [['Approve',()=>{S.status='approved';S.reviewer=me().id;closePanel();render();say(me().name+' signs off as reviewer. Two names on the change, neither of them PIP.')},'primary'],
   ['Send it back for changes',()=>{S.status='paused';closePanel();render();say('Sent back. The draft is open for editing again.')}],['Step away',closePanel]])}
function handoffNote(){panel('A note for Priya','<p>She lands at ten. What does she find in her inbox?</p>',[
  ['“Caught an error in the refund email and fixed it. All good now!”',()=>{S.note='thin';finish('done')}],
  ['“What PIP drafted, what the signed policy says, what we changed, who reviewed it. Paused, not sent: your call when you land. Suggestion: no PIP campaign gets scheduled until a named person has checked it against the source.”',()=>{S.note='full';finish('done')}],
  ['“PIP can’t be trusted. I recommend we switch it off.”',()=>{S.note='ban';finish('done')}],
  ['Not yet',closePanel]])}

/* ---------- engine ---------- */
function go(room,x){S.loc[me().id]=room;S.x[me().id]=x;if(tick(2))return;render()}
function act(sp){if(busy||!$('panel').hidden)return;const c=me(),cx=sp.box[0]+sp.box[2]/2;
  const tx=sp.stand??Math.max(50,Math.min(910,cx<480?cx+78:cx-78));
  const run=()=>{busy=false;S.x[c.id]=tx;
    if(sp.exit)return go(sp.exit,sp.at);
    const h=sp.on&&sp.on[S.verb];
    if(h){h(c);if(S.verb!=='look'&&S.screen==='game'&&$('panel').hidden&&tick(1))return}else say({look:'Nothing more to see there.',use:'That is not something to use right now.',take:'Better left where it is.',open:'It does not open.',talk:'No answer. You did not really expect one.'}[S.verb]);
    if(S.screen==='game')drawScene()};
  const m=$('me'),far=Math.abs((S.x[c.id]||0)-tx)>4,quick=matchMedia('(prefers-reduced-motion:reduce)').matches;
  if(m&&far&&!quick){busy=true;m.style.transform=`translate(${tx}px,0)`;setTimeout(run,380)}else run()}
function spots(){return ROOMS[S.loc[me().id]].spots.filter(s=>!s.show||s.show())}
function drawScene(){const c=me(),room=ROOMS[S.loc[c.id]],mate=CAST[S.cast[1-S.active]];
  let s=`<svg viewBox="0 0 960 420" role="img" aria-label="${room.name}">`+defs()+room.bg()+(room.pre?room.pre():'');
  s+=spots().map(sp=>{const[x,y,w,h]=sp.box;return `<g class="hs" data-id="${sp.id}" tabindex="0" role="button" aria-label="${sp.name}">${sp.art()}<rect class="ring" x="${x-5}" y="${y-5}" width="${w+10}" height="${h+10}" rx="8"/></g>`}).join('');
  if(room.fg)s+=room.fg();
  if(S.loc[mate.id]===S.loc[c.id])s+=fig(mate,S.x[mate.id],false);
  s+=fig(c,S.x[c.id],true)+'</svg>';
  const st=$('stage');st.innerHTML=s;$('roomname').textContent=room.name;
  if(st.scrollWidth>st.clientWidth)st.scrollLeft=S.x[c.id]/960*st.scrollWidth-st.clientWidth/2}
function drawTop(){const g=S.screen==='game';['clock','chip','bHint','bHow','bRestart'].forEach(i=>$(i).hidden=!g);if(!g)return;
  $('clock').textContent=fmt(S.min);const ch=$('chip'),left=SEND-S.min;
  if(stopped()){ch.textContent='Send paused';ch.className='chip ok'}else{ch.textContent=`Sends in ${Math.max(0,left)} min`;ch.className='chip'+(left<=15?' hot':left<=30?' warn':'')}}
function drawTalk(){const L=S.log.slice(-4);$('talk').innerHTML=L.map((l,i)=>l.got?`<p class="got">+ team folder: ${l.got}</p>`:`<p class="${i<L.length-1?'old':''}">${l.who?`<b>${l.who}:</b> `:''}${l.t}</p>`).join('')}
function drawItems(){$('items').innerHTML=S.inv.length?S.inv.map(i=>`<button data-item="${i}">${ITEMS[i][0]}</button>`).join(''):'<span class="none">Empty. What the team finds is shared here.</span>'}
function drawVerbs(){$('verbs').innerHTML=VERBS.map(([k,l])=>`<button data-verb="${k}" aria-pressed="${S.verb===k}">${l}</button>`).join('');sentence('')}
function drawCast(){$('cast').innerHTML=S.cast.map((id,i)=>{const c=CAST[id];return `<button data-cast="${i}" aria-pressed="${i===S.active}"><i style="background:${c.shirt}"></i>${c.name} <small>${ROOMS[S.loc[id]].name}</small></button>`}).join('')}
function sentence(n){$('sentence').textContent=VERBS.find(v=>v[0]===S.verb)[1]+(n?' '+n:' …')}
function render(){$('title').hidden=S.screen!=='title';$('game').hidden=S.screen!=='game';$('end').hidden=S.screen!=='end';drawTop();
  if(S.screen==='title')return drawTitle();if(S.screen==='end')return drawEnd();
  drawScene();drawTalk();drawItems();drawVerbs();drawCast()}
function panel(title,html,choices){if(S.screen!=='game')return;PFN=choices.map(c=>c[1]);const p=$('panel');
  p.innerHTML=`<h3>${title}</h3><div class="body">${html}</div><div class="choices">${choices.map((c,i)=>`<button class="btn ${c[2]||''}" data-ch="${i}">${c[0]}</button>`).join('')}</div>`;
  p.hidden=false;$('controls').hidden=true;const b=p.querySelector('button');if(b)b.focus({preventScroll:true});p.scrollIntoView({block:'nearest'})}
function closePanel(){$('panel').hidden=true;$('controls').hidden=false;PFN=[]}
function finish(kind){S.ending=kind;S.screen='end';closePanel();render();window.scrollTo(0,0)}

function hint(){const f=S.f;let h;
  if(S.status==='approved')h='Use the scheduler console and hand the campaign back to Priya.';
  else if(S.status==='submitted')h='The author cannot review their own fix. Switch to your teammate with the buttons above the scene and bring them to the console.';
  else if(S.status==='paused')h='Use the scheduler console and edit the draft. Check each claim against the team folder. Not every claim is wrong.';
  else if(f.auth)h='Marcus has unlocked Pause. Use the scheduler console in the bullpen.';
  else if(!f.seenScreen&&!f.seenDraft)h='Start in the bullpen. Look at the wall screen, then use the console to read the draft.';
  else if(!has('trace'))h='Talk to PIP in the bullpen. Don’t ask whether it’s sure. Ask what it read.';
  else if(!has('policy'))h='You need the policy that is actually in force. The signed copy is in Records, off the hallway. '+(onTeam('lucia')?'Lucía carries a key.':'Keys are signed out at the lobby desk: sign the log, then take the key.');
  else if(!f.onCall)h='Who is allowed to pause a send? Read the note on Priya’s desk, then check the kitchen.';
  else h='Use the desk phone in the bullpen. Call Marcus and tell him what the draft says and what the signed policy says.';
  say('Hint: '+h)}
function howTo(){panel('How to play','<p>Pick a verb, then click something in the room. Arrows and doorways move you between rooms.</p><p>You control two people. Switch between them with the name buttons above the scene. They can be in different rooms, and each can do things the other cannot.</p><p>Looking is free. Other actions cost a minute and changing rooms costs two. The email sends at 9:00 unless someone stops it.</p>',[['Back to it',closePanel]])}

/* ---------- title + debrief ---------- */
function face(c){return `<svg viewBox="-40 214 80 120" aria-hidden="true">${fig(c,0,false).replace('opacity=".72"','opacity="1"').replace(/style="[^"]*"/,'')}</svg>`}
function drawTitle(){$('title').innerHTML=`
  <div class="lede">It’s 7:30. At 9:00 the AI emails <em>4,112 customers</em> something that isn’t true.</div>
  <p>You came in early and glanced at the campaign board. <strong>PIP</strong>, the company’s writing assistant, has a refund announcement queued. Nobody reviewed it. The manager who owns it is on a plane. Something in it looks wrong, and you have ninety minutes to find out what, prove it, and get it stopped by someone who is allowed to stop it.</p>
  <div><h2 style="font-size:20px;margin-bottom:10px">Cast two people</h2>
  <div class="castpick">${Object.values(CAST).map(c=>`<button class="card" data-pick="${c.id}" aria-pressed="${S.pick.includes(c.id)}">${face(c)}<span><b>${c.full}</b><span>${c.role}</span><span>${c.skill}</span></span></button>`).join('')}</div></div>
  <div class="startrow"><button class="btn primary" id="bStart" ${S.pick.length===2?'':'disabled'}>Walk into the office</button><span style="color:var(--ink-soft);font-size:14px">${S.pick.length===2?'Any pair can finish. Each pair finds a different way through.':'Choose '+(2-S.pick.length)+' more.'}</span></div>
  <div class="how">A point-and-click rehearsal of one workplace moment: an AI system is confidently wrong and the clock is running. It takes about ten minutes. There are shortcuts, and they work. The debrief at the end shows what each one cost.</div>`}
function begin(){const p=S.pick.slice();S=fresh();S.pick=p;S.cast=p;S.screen='game';p.forEach((id,i)=>{S.loc[id]='lobby';S.x[id]=380+i*90});
  S.log=[{t:'The lobby, before sunrise. The cleaners have gone and the lights are on timers. Through the arch, the campaign board glows red.',who:''}];
  render();speak('Let’s see what PIP is about to send.')}

function drawEnd(){const f=S.f,k=S.ending,done=k==='done';const right=CLAIMS.filter(c=>S.draft[c.k]===c.ok).length;
  const names=S.cast.map(i=>CAST[i].name).join(' and ');let kick,head,story;
  if(k==='sent'){kick='9:00 AM';head='Sent.';story=`The wall screen turns green: 4,112 delivered. By 9:20 the first replies arrive, thanking Marlow & Finch for the new 60-day refund on every plan. ${names} had the right instinct and ran out of morning.`}
  else if(k==='plug'){kick=fmt(S.min);head='Stopped, at a cost.';story='The hum drops a note and the 9:00 send never leaves. Neither do the payroll notices, or any password reset for the next three hours. The refund email is still wrong, still queued, and will go the moment someone plugs MAIL-01 back in.'}
  else if(f.usedCreds){kick=`Paused at ${fmt(S.pausedAt)}`;head='It worked. Read the audit log.';story=`The email did not go out wrong. But the record says Priya paused${f.selfApproved?', edited and approved':''} a campaign from 35,000 feet, and the first thing she has to do when she lands is work out who was being her.`}
  else{kick=`Paused at ${fmt(S.pausedAt)}, ${SEND-S.pausedAt} minutes to spare`;head=right===4?'Clean interrupt.':'Stopped in time. Check the fix.';story=`${names} stopped the send through someone with the authority to stop it, and every action has the right name beside it. ${right===4?'The corrected draft matches the signed policy line for line.':'The corrected draft still has a problem in it.'}`}
  const rows=[];const row=(st,title,did,idea)=>rows.push({st,title,did,idea});
  row(has('policy')?'good':has('wiki')?'warn':'miss','Check against the source of record',
    has('policy')?'You found the signed v3 policy in Records.':has('wiki')?'You found the wiki page, which was two years out of date, and never reached the signed policy.':'You never found a policy to compare the draft with.',
    'An AI draft is a claim. The check is the document that is actually in force, not the nearest copy of it.');
  row(has('trace')?'good':'miss','Ask what it read, not whether it’s sure',
    has('trace')?'You asked PIP for its sources: an unapproved proposal and a policy number with no document.'+(f.askedSure?' You also asked if it was sure. It was.':''):(f.askedSure?'You asked PIP if it was sure. It said yes, at 97%. You did not ask what it had read.':'You never asked PIP where the numbers came from.'),
    'Confidence costs a model nothing. Sources can be checked.');
  row(has('impact')||has('tickets')?'good':'miss','Size the consequence',
    has('impact')?'Ravi put a number on it: 1,240 customers, about $186,000.':has('tickets')?'Dana showed the email would contradict what support told three customers this week.':'Nobody worked out who would be affected, or by how much.',
    'People with authority act faster when they know how much is at stake.');
  row(k==='plug'?'miss':f.usedCreds?'miss':f.auth?'good':'miss','Interrupt through someone who is allowed to',
    k==='plug'?'You pulled the power on the mail server and took payroll notices and password resets down with the campaign.':f.usedCreds?'You signed in as Priya with the password under her keyboard.':f.auth?'Marcus, the ops on-call, authorised the pause and you made it under your own name.':'The send was never paused.',
    'Knowing who can stop the work matters before the morning you need them. A borrowed login stops the email and breaks the record of who did what.');
  row(f.auth&&!f.calledEmpty&&!S.told.wiki?'good':f.auth?'warn':f.calledEmpty||S.told.wiki?'miss':'na','Escalate with evidence',
    f.auth?(f.calledEmpty||S.told.wiki?'Your first call to Marcus did not have enough behind it and cost you time. The second one did.':'You told Marcus what the draft said, what the signed policy said, and he acted in one call.'):f.calledEmpty||S.told.wiki?'You called Marcus without the signed policy, and he could not act on it.':'You never called the on-call.',
    '“What does it say, what should it say, how do you know” gets a decision. A bad feeling gets a callback.');
  row(!done?'na':right===4?'good':'warn','Fix what is wrong and only that',
    !done?'You did not get as far as the fix.':right===4?'All four claims match the signed policy, including the $14 credit, which PIP had right.':`${right} of 4 claims match the signed policy.`+(S.draft.credit!==0?' The $14 credit was correct as drafted, and you changed it.':''),
    'A draft with errors in it is rarely wrong everywhere. Check each claim on its own.');
  row(!done?'na':f.selfApproved?'miss':'good','A second person reads it',
    !done?'You did not get as far as review.':f.selfApproved?'You approved your own fix under Priya’s name.':`${CAST[S.reviewer].name} reviewed what ${CAST[S.author].name} wrote.`,
    'The missing reviewer is how this draft got scheduled in the first place.');
  row(!done?'na':S.note==='full'?'good':'warn','Leave the workflow better',
    !done?'You did not get as far as the handoff.':S.note==='full'?'Your note gave Priya the evidence, the decision that is still hers, and a change to the process.':S.note==='thin'?'Your note said it was fixed. Priya does not know what happened or how to stop it happening again.':'You recommended switching PIP off.',
    'One bad draft shows the workflow had no check in it. That is the thing to fix.');
  const good=rows.filter(r=>r.st==='good').length;const lab={good:'Done',warn:'Partly',miss:'Missed',na:'Not reached'};
  $('end').innerHTML=`<div><div class="kicker">${kick}</div><h2>${head}</h2></div><p class="story">${story}</p>
   <div class="tally">${good} of 8 practices · cast: ${S.cast.map(i=>CAST[i].full).join(', ')}</div>
   <div class="rows">${rows.map(r=>`<div class="row ${r.st}"><div class="tag">${lab[r.st]}</div><div><h3>${r.title}</h3><p class="did">${r.did}</p><p>${r.idea}</p></div></div>`).join('')}</div>
   <div class="startrow"><button class="btn primary" id="bAgain">Run it again with a different cast</button></div>`}

/* ---------- input ---------- */
document.addEventListener('click',e=>{const t=e.target.closest('[data-id],[data-verb],[data-item],[data-cast],[data-ch],[data-pick],#bStart,#bAgain,#bHint,#bHow,#bRestart');if(!t)return;
  if(t.dataset.pick){const i=S.pick.indexOf(t.dataset.pick);if(i>=0)S.pick.splice(i,1);else{if(S.pick.length===2)S.pick.shift();S.pick.push(t.dataset.pick)}return drawTitle()}
  if(t.id==='bStart'){if(S.pick.length===2)begin();return}
  if(t.id==='bAgain'||t.id==='bRestart'){busy=false;S=fresh();closePanel();return render()}
  if(t.id==='bHint'){return hint()}
  if(t.id==='bHow'){return howTo()}
  if(t.dataset.ch){const fn=PFN[+t.dataset.ch];if(fn)fn();return}
  if(busy||!$('panel').hidden)return;
  if(t.dataset.verb){S.verb=t.dataset.verb;return drawVerbs()}
  if(t.dataset.item){return say(ITEMS[t.dataset.item][1])}
  if(t.dataset.cast){S.active=+t.dataset.cast;render();return}
  if(t.dataset.id){const sp=spots().find(s=>s.id===t.dataset.id);if(sp)act(sp)}});
document.addEventListener('keydown',e=>{const t=e.target.closest&&e.target.closest('.hs');if(t&&(e.key==='Enter'||e.key===' ')){e.preventDefault();t.dispatchEvent(new MouseEvent('click',{bubbles:true}))}});
document.addEventListener('mouseover',e=>{const t=e.target.closest&&e.target.closest('.hs');if(t&&S.screen==='game'){const sp=spots().find(s=>s.id===t.dataset.id);if(sp)sentence(sp.exit?'→ '+sp.name:sp.name)}});
document.addEventListener('mouseout',e=>{if(e.target.closest&&e.target.closest('.hs')&&S.screen==='game')sentence('')});

function start(data){S=data&&data.screen?data:fresh();render()}
window.claude?.hot?.snapshot?.(()=>S);
if(window.claude?.hot?.ready)window.claude.hot.ready(start);else start(window.claude?.hot?.data??{});
</script>
