<title>The Nine O'Clock Send</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Atkinson+Hyperlegible:wght@400;700&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
/* Layout: one column. Clock strip, the stage (a wide illustrated room), then a control deck
   under it that swaps between verbs + folder and a conversation panel. Single visual world:
   an office before sunrise, lit by one amber lamp. */
:root{
  color-scheme:dark;
  --night:#121829; --deck:#1a2238; --deck-2:#232d4a; --line:#36426b;
  --ink:#f3efe6; --ink-soft:#aab2cd; --lamp:#ffb44a; --lamp-ink:#2a1a00;
  --go:#62d8a6; --stop:#ff6f61; --pip:#8fd6ff;
  --display:'Bricolage Grotesque','Avenir Next','Segoe UI',sans-serif;
  --body:'Atkinson Hyperlegible','Segoe UI',system-ui,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--night);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;
  padding-block:14px 28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1000px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;line-height:1.1}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,.hs:focus-visible,input:focus-visible{outline:3px solid var(--lamp);outline-offset:2px}
.btn{background:var(--deck-2);border:1px solid var(--line);border-radius:8px;padding:9px 14px;text-align:left}
.btn:hover{border-color:var(--lamp)}
.btn.primary{background:var(--lamp);color:var(--lamp-ink);border-color:var(--lamp);font-weight:700}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.ghost{background:none;border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:14px;color:var(--ink-soft)}
.ghost:hover{color:var(--ink);border-color:var(--ink-soft)}
.mono{font-family:var(--mono)}

.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px}
.top h1{font-size:22px;letter-spacing:-.01em;margin-right:auto}
.clock{font-family:var(--mono);font-weight:600;font-size:20px;font-variant-numeric:tabular-nums}
.chip{font-family:var(--mono);font-size:13px;padding:4px 10px;border-radius:999px;border:1px solid var(--line);color:var(--ink-soft)}
.chip.warn{color:var(--lamp);border-color:var(--lamp)}
.chip.hot{color:var(--stop);border-color:var(--stop);animation:throb 1s infinite alternate}
.chip.ok{color:var(--go);border-color:var(--go)}
@keyframes throb{to{background:#ff6f6122}}

/* title */
.intro{display:grid;gap:22px}
.hero{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#0d1220}
.hero svg{display:block;width:100%;height:auto;font-family:var(--mono)}
.intro .lede{font-size:clamp(30px,6vw,52px);font-weight:700;letter-spacing:-.02em;max-width:17ch;font-family:var(--display);line-height:1.05}
.intro .lede em{font-style:normal;color:var(--lamp)}
.intro p{max-width:62ch;margin:0;color:var(--ink-soft)}
.intro p strong{color:var(--ink)}
.castpick{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}
.card{display:grid;grid-template-columns:56px 1fr;gap:10px;align-items:center;background:var(--deck);border:1px solid var(--line);border-radius:10px;padding:10px 12px;text-align:left}
.card svg{width:56px;height:84px}
.card b{font-family:var(--display);font-size:17px;display:block}
.card span{font-size:14px;color:var(--ink-soft);display:block}
.chcard{grid-template-columns:1fr;gap:4px;align-items:start}
.card[aria-pressed="true"]{border-color:var(--lamp);background:var(--deck-2);box-shadow:inset 0 0 0 1px var(--lamp)}
.startrow{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.seed{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:14px;color:var(--ink-soft)}
.seed input{font:inherit;font-family:var(--mono);width:7em;background:var(--deck);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:5px 8px}
.how{font-size:14px;color:var(--ink-soft);border-top:1px solid var(--line);padding-top:14px;display:grid;gap:10px;max-width:72ch}
.endings{display:flex;flex-wrap:wrap;gap:6px}
.endings span{font-family:var(--mono);font-size:12px;border:1px solid var(--line);border-radius:999px;padding:3px 10px}
.endings span.on{color:var(--lamp);border-color:var(--lamp)}

/* stage */
.stage{border:1px solid var(--line);border-radius:10px;overflow-x:auto;background:#0d1220}
.stagein{position:relative;min-width:640px}
.stage svg{display:block;width:100%;height:auto;font-family:var(--mono)}
.stage svg.enter{animation:fade .3s ease}
@keyframes fade{from{opacity:.2}}
.hs{cursor:pointer;outline:none}
.hs .ring{fill:transparent;stroke:transparent;stroke-width:2;stroke-dasharray:5 4;pointer-events:all}
.hs:hover .ring,.hs:focus-visible .ring{stroke:var(--lamp)}
.fig{transition:transform .36s linear;pointer-events:none}
.leg{transform-box:fill-box;transform-origin:50% 0}
.walking .leg{animation:step .26s ease-in-out infinite alternate}
.walking .leg.b{animation-direction:alternate-reverse}
@keyframes step{from{transform:rotate(-17deg)}to{transform:rotate(17deg)}}
.led{animation:led 1.4s steps(2) infinite}
@keyframes led{50%{opacity:.25}}
.pulse{animation:pulse 2.6s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}
@keyframes pulse{to{opacity:.55;transform:scale(1.12)}}
.steam{animation:steam 2.4s ease-in-out infinite}
@keyframes steam{from{opacity:.5;transform:translateY(0)}to{opacity:0;transform:translateY(-16px)}}
.alarm{animation:led .8s steps(2) infinite}
.bubble{position:absolute;bottom:55%;transform:translateX(-50%);max-width:min(300px,60%);background:var(--ink);color:#1a2238;border-radius:12px;padding:7px 12px;font-size:14px;line-height:1.35;pointer-events:none;box-shadow:0 4px 0 #0006;animation:pop .18s ease}
.bubble::after{content:"";position:absolute;left:50%;bottom:-8px;margin-left:-8px;border:8px solid transparent;border-top-color:var(--ink);border-bottom:0}
@keyframes pop{from{opacity:0}}
@media (prefers-reduced-motion:reduce){.fig{transition:none}.walking .leg,.led,.pulse,.steam,.alarm,.chip.hot,.stage svg.enter,.bubble{animation:none}}
.roomname{font-family:var(--mono);font-size:13px;color:var(--ink-soft);letter-spacing:.08em;text-transform:uppercase}
.stagehead{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between}
.cast{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.cast button.who{display:flex;align-items:center;gap:8px;background:var(--deck);border:1px solid var(--line);border-radius:999px;padding:3px 12px 3px 4px;font-size:14px}
.cast button.who i{width:22px;height:22px;border-radius:50%;display:block}
.cast button.who[aria-pressed="true"]{border-color:var(--lamp);color:var(--lamp)}
.cast button small{color:var(--ink-soft);font-size:12px}

.talk{min-height:92px;background:var(--deck);border:1px solid var(--line);border-radius:10px;padding:10px 14px;display:flex;flex-direction:column;justify-content:flex-end;gap:4px}
.talk p{margin:0;max-width:78ch}
.talk p.old{color:var(--ink-soft);font-size:14px;opacity:.75}
.talk b{font-family:var(--display);color:var(--lamp);font-weight:700}
.talk .got{color:var(--go);font-family:var(--mono);font-size:13px}

.sentence{font-family:var(--mono);font-size:14px;color:var(--lamp);min-height:21px}
.deck{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:12px}
@media (max-width:640px){.deck{grid-template-columns:1fr}}
.verbs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;align-content:start}
.verbs button{background:var(--deck);border:1px solid var(--line);border-radius:8px;padding:10px 6px;font-family:var(--display);font-weight:700;font-size:16px}
.verbs button[aria-pressed="true"]{background:var(--lamp);color:var(--lamp-ink);border-color:var(--lamp)}
.folder{background:var(--deck);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0}
.folder h3,.label{font-family:var(--mono);font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:8px}
.folder .items{display:flex;flex-wrap:wrap;gap:6px}
.folder .items button{background:var(--deck-2);border:1px solid var(--line);border-radius:6px;padding:5px 10px;font-size:14px}
.folder .items button:hover{border-color:var(--lamp)}
.folder .none{color:var(--ink-soft);font-size:14px}

.panel{background:var(--deck);border:1px solid var(--lamp);border-radius:10px;padding:14px 16px;display:grid;gap:12px}
.panel .ph{display:flex;gap:12px;align-items:center}
.panel .ph svg{width:44px;height:66px;flex:none}
.panel .ph .kick{font-family:var(--mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--lamp)}
.panel h3{font-size:18px}
.panel .body{max-width:74ch}
.panel .body p{margin:0 0 8px}
.panel .choices{display:grid;gap:6px}
.screen{font-family:var(--mono);font-size:14px;background:#0c1120;border:1px solid var(--line);border-radius:8px;padding:12px 14px;line-height:1.6;overflow-wrap:anywhere}
.screen mark{background:none;color:var(--lamp);border-bottom:1px dashed var(--lamp)}
.code{font-size:30px;letter-spacing:.4em;color:var(--lamp);font-weight:600}
.cols{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:14px}
@media (max-width:720px){.cols{grid-template-columns:1fr}}
fieldset{border:1px solid var(--line);border-radius:8px;padding:8px 12px;margin:0 0 8px;min-width:0}
legend{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft);padding:0 6px}
fieldset label,.lines label{display:flex;gap:8px;align-items:baseline;padding:3px 0;font-size:15px}
.lines{display:grid;gap:4px}
.lines label{background:var(--deck-2);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.evlist{font-size:14px;color:var(--ink-soft);display:grid;gap:8px;align-content:start}
.evlist b{color:var(--ink);font-family:var(--display)}

.end{display:grid;gap:18px}
.end .kicker{font-family:var(--mono);font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--lamp)}
.end h2{font-size:clamp(28px,5vw,44px);letter-spacing:-.02em}
.end .story{max-width:66ch;color:var(--ink-soft);margin:0}
.rows{display:grid;gap:8px}
.row{display:grid;grid-template-columns:96px minmax(0,1fr);gap:12px;background:var(--deck);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.row .tag{font-family:var(--mono);font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding-top:3px}
.row.good .tag{color:var(--go)} .row.warn .tag{color:var(--lamp)} .row.miss .tag{color:var(--stop)} .row.na .tag{color:var(--ink-soft)}
.row h3{font-size:17px;margin-bottom:2px}
.row p{margin:0;font-size:15px;color:var(--ink-soft)}
.row p.did{color:var(--ink)}
@media (max-width:480px){.row{grid-template-columns:1fr;gap:4px}}
.tally{font-family:var(--mono);font-size:15px}
.beats{display:grid;gap:2px;font-size:15px;margin:0;padding:0;list-style:none}
.beats li{display:grid;grid-template-columns:5.5em minmax(0,1fr);gap:10px}
.beats time{font-family:var(--mono);color:var(--lamp);font-variant-numeric:tabular-nums}
.ask{background:var(--deck);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.ask ol{margin:8px 0 0;padding-left:1.3em;display:grid;gap:6px;max-width:68ch}
#sum{width:100%;min-height:160px;background:var(--deck);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:10px;font:14px var(--mono)}
.menu{position:absolute;transform:translateX(-50%);z-index:5;background:var(--deck);border:1px solid var(--lamp);border-radius:10px;padding:6px;display:grid;gap:4px;min-width:170px;box-shadow:0 6px 0 #0007}
.menu .mt{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft);padding:2px 8px}
.menu button{background:var(--deck-2);border:1px solid var(--line);border-radius:7px;padding:8px 12px;text-align:left;font-family:var(--display);font-weight:700;font-size:15px}
.menu button:hover,.menu button:focus-visible{border-color:var(--lamp);color:var(--lamp)}
.hs.hl .ring{stroke:var(--lamp);stroke-width:4;stroke-dasharray:none;animation:led 1s steps(2) infinite}
@media (prefers-reduced-motion:reduce){.hs.hl .ring{animation:none}}
.coach{background:#ffb44a18;border:1px solid var(--lamp);border-radius:10px;padding:9px 14px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.coach b{color:var(--lamp);font-family:var(--mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;margin-right:10px}
.todo{list-style:none;margin:0;padding:0;display:grid;gap:5px;font-size:15px}
.todo li{display:grid;grid-template-columns:18px minmax(0,1fr);gap:6px}
.todo li::before{content:"○";color:var(--lamp)}
.todo li.done{color:var(--ink-soft);text-decoration:line-through}
.todo li.done::before{content:"●";color:var(--go)}
.askrow{display:flex;gap:6px;flex-wrap:wrap}
.askrow input{flex:1 1 220px;min-width:0;font:inherit;background:#0c1120;color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:9px 12px}
.ainote{font-family:var(--mono);font-size:12px;color:var(--ink-soft);margin-top:4px}
.checker{border-top:1px solid var(--line);padding-top:12px;margin-top:6px;display:grid;gap:8px}
details summary{cursor:pointer;color:var(--ink);font-family:var(--display);font-weight:700}
.folder .items button.gchip{border-color:var(--pip);color:var(--pip)}
.splash{position:relative}
.splash .logo{position:absolute;left:5%;top:9%;display:grid;gap:8px;pointer-events:none}
.splash .logo span{font-family:var(--mono);font-size:clamp(10px,1.5vw,14px);letter-spacing:.14em;text-transform:uppercase;color:var(--lamp)}
.splash .logo b{font-family:var(--display);font-weight:700;font-size:clamp(34px,8.5vw,92px);line-height:.92;letter-spacing:-.03em;text-shadow:0 4px 0 #0008}
.btn.big{font-size:20px;padding:13px 30px;font-family:var(--display);font-weight:700;text-align:center}
.step{font-size:clamp(24px,4vw,34px);letter-spacing:-.02em}
.days{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.day{display:grid;gap:4px;text-align:left;background:var(--deck);border:2px solid var(--line);border-radius:12px;padding:0 0 12px;overflow:hidden;transition:transform .12s}
.day:hover,.day:focus-visible{border-color:var(--lamp);transform:translateY(-3px)}
.day svg{display:block;width:100%;height:auto;margin-bottom:6px;font-family:var(--mono)}
.day>span,.day>b{padding:0 12px}
.day .dn{font-family:var(--mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--lamp)}
.day b{font-family:var(--display);font-size:20px;line-height:1.1}
.day>span{font-size:14px;color:var(--ink-soft)}
.day .badge{font-family:var(--mono);font-size:12px;margin-top:4px}
.day .badge.on{color:var(--go)}
.capt{display:flex;flex-wrap:wrap;gap:6px 18px;min-height:26px;color:var(--ink-soft)}
.capt b{color:var(--lamp);font-family:var(--display)}
.bubble.tut{bottom:auto;top:6%;background:var(--lamp);color:var(--lamp-ink);max-width:min(340px,70%)}
.bubble.tut::after{border-top-color:var(--lamp)}
.bob{animation:bob .6s ease-in-out infinite alternate}
@keyframes bob{to{transform:translateY(-10px)}}
@media (prefers-reduced-motion:reduce){.bob{animation:none}.day{transition:none}}
/* ---------- console-game skin ---------- */
#game{display:grid;gap:12px}
.console{border:4px solid #070a14;border-radius:20px;background:#070a14;overflow:hidden;box-shadow:0 10px 0 #05070e}
.hud{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding:8px 12px;background:#0d1322}
.hud .hday{font-family:var(--display);font-weight:700;color:var(--lamp);font-size:17px}
.hud .clock{font-size:18px}
.tbar{flex:1 1 120px;height:18px;background:#1a2238;border:3px solid #070a14;border-radius:999px;overflow:hidden;min-width:90px}
.tbar i{display:block;height:100%;width:100%;background:var(--go);border-radius:999px;transition:width .4s}
.tbar i.warn{background:var(--lamp)}.tbar i.hot{background:var(--stop);animation:led .6s steps(2) infinite}.tbar i.ok{background:var(--pip)}
.screenwrap{position:relative}
.console .stage{border:0;border-radius:0}
.screenwrap.dim .stagein{filter:brightness(.42) saturate(.7)}
.console .talk{border:0;border-top:4px solid #070a14;border-radius:0;background:var(--ink);color:#1a2238;min-height:88px;font-size:17px;padding:12px 34px 12px 16px;position:relative}
.console .talk p.old{color:#47506a;opacity:1;font-size:15px}
.console .talk b{display:inline-block;background:#1a2238;color:var(--lamp);border-radius:8px;padding:0 9px;margin-right:8px;font-size:14px}
.talk .more{position:absolute;right:14px;bottom:8px;border:7px solid transparent;border-top-color:#1a2238;animation:bob .5s infinite alternate}
.toasts{position:absolute;top:10px;left:0;right:0;display:grid;justify-items:center;gap:6px;pointer-events:none;z-index:6}
.toast{display:flex;gap:10px;align-items:center;background:var(--lamp);color:var(--lamp-ink);border:3px solid #070a14;border-radius:14px;padding:6px 16px 6px 8px;box-shadow:0 5px 0 #070a14;animation:toast 2.6s both}
.toast svg{width:30px;height:30px;flex:none}.toast small{display:block;font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase}.toast b{font-family:var(--display);font-size:17px;line-height:1.1}
@keyframes toast{0%{transform:translateY(-30px) scale(.6);opacity:0}8%{transform:translateY(0) scale(1.08);opacity:1}14%{transform:scale(1)}85%{opacity:1}100%{opacity:0;transform:translateY(-10px)}}
.console .panel{border:4px solid #070a14;border-radius:18px;box-shadow:0 6px 0 #070a14;grid-template-columns:auto minmax(0,1fr);align-items:end;animation:rise .18s ease-out;margin:10px}
.console .panel:not(.haspic){grid-template-columns:minmax(0,1fr)}
.panel .pmain{display:grid;gap:10px;min-width:0}
.panel .bust{width:clamp(64px,13vw,130px);align-self:end;margin:0 0 -14px -6px;animation:pop .25s cubic-bezier(.3,1.6,.5,1) both}
.panel .bust svg{width:100%;height:auto;display:block;filter:drop-shadow(0 4px 0 #070a14)}
.panel .ph h3{display:inline-block;background:var(--lamp);color:var(--lamp-ink);border-radius:10px;padding:3px 12px;font-size:16px}
.panel .body{font-size:17px}
.choices.wait{visibility:hidden}
.choices.two{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.panel .choices .btn{position:relative;padding:8px 12px 8px 34px}
.panel .choices .btn:focus-visible,.panel .choices .btn:hover{background:var(--lamp);color:var(--lamp-ink);outline:none;border-color:#070a14}
.panel .choices .btn:focus-visible::before,.panel .choices .btn:hover::before{content:"";position:absolute;left:12px;top:50%;margin-top:-7px;border:7px solid transparent;border-left:10px solid currentColor}
@media (min-width:720px){.console .panel:not(.big){position:absolute;left:4px;right:4px;bottom:4px;max-height:calc(100% - 28px);overflow:auto;z-index:4}}
@keyframes rise{from{transform:translateY(20px);opacity:0}}@keyframes pop{from{transform:scale(.4) translateY(40px);opacity:0}}
.btn{border:3px solid #070a14;border-radius:12px;box-shadow:0 4px 0 #070a14}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #070a14}
.btn.primary{border-color:#070a14}
.folder{border:4px solid #070a14;border-radius:16px;box-shadow:0 6px 0 #05070e}
.menu{border:4px solid #070a14;border-radius:14px}
.day{border:4px solid #070a14;border-radius:16px;box-shadow:0 6px 0 #05070e}
.cast button.who{border:3px solid #070a14;padding:2px 12px 2px 2px}
.cast button.who[aria-pressed="true"]{border-color:var(--lamp)}
.cast button.who i.pf{overflow:hidden;position:relative;width:34px;height:34px}
.pf svg{position:absolute;width:44px;height:66px;left:-5px;top:-7px}
.folder .items button{display:inline-flex;gap:7px;align-items:center;border:2px solid #070a14;border-radius:9px}
.folder .items button::before{content:"";width:11px;height:14px;background:var(--ink);border-radius:2px;box-shadow:inset 0 -3px 0 #aab2cd}
.result{display:grid;grid-template-columns:200px minmax(0,1fr) auto;gap:18px;align-items:center;border:4px solid #070a14;border-radius:20px;padding:16px;box-shadow:0 8px 0 #05070e;background:linear-gradient(180deg,#232d4a,#1a2238)}

function tick(n){S.min+=n;drawTop();

let AC=null,ambG=null,soundOn=false;
function tone(f,d,type,g,when){if(!soundOn||!AC)return;try{const t=AC.currentTime+(when||0),o=AC.createOscillator(),v=AC.createGain();o.type=type||'sine';o.frequency.value=f;
  v.gain.setValueAtTime(g||.05,t);v.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(v);v.connect(AC.destination);o.start(t);o.stop(t+d+.03)}catch(e){}}
const SFX={click:()=>tone(520,.05,'triangle',.04),get:()=>{tone(660,.09,'triangle',.05);tone(990,.16,'triangle',.05,.08)},deny:()=>tone(150,.16,'sawtooth',.035),
  door:()=>{tone(110,.12,'square',.04);tone(80,.18,'sine',.06,.08)},ring:()=>[0,.45].forEach(w=>{tone(440,.3,'sine',.035,w);tone(480,.3,'sine',.035,w)}),
  tick:()=>tone(1250,.03,'square',.02),talk:()=>tone(280+Math.random()*160,.04,'square',.012),cut:()=>{tone(196,.5,'sine',.05);tone(233,.6,'sine',.04,.12)},
  win:()=>[523,659,784,1047].forEach((f,i)=>tone(f,.5,'triangle',.05,i*.09)),lose:()=>[392,330,262,196].forEach((f,i)=>tone(f,.45,'sawtooth',.03,i*.15))};
function sfx(n){if(soundOn&&SFX[n])SFX[n]()}
function toggleSound(){soundOn=!soundOn;try{if(soundOn){AC=AC||new(window.AudioContext||window.webkitAudioContext)();AC.resume();
    if(!ambG){const len=AC.sampleRate*2,buf=AC.createBuffer(1,len,AC.sampleRate),d=buf.getChannelData(0);let l=0;for(let i=0;i<len;i++){l=(l+.02*(Math.random()*2-1))/1.02;d[i]=l*3}
      const src=AC.createBufferSource();src.buffer=buf;src.loop=true;const lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=220;ambG=AC.createGain();src.connect(lp);lp.connect(ambG);ambG.connect(AC.destination);src.start()}
    ambG.gain.value=.12;sfx('get')}else if(ambG)ambG.gain.value=0}catch(e){soundOn=false}
  Music.set(soundOn);$('bSound').textContent='Music & sound: '+(soundOn?'on':'off')}

const Tx=(x,y,s,f,z=12,o='')=>`<text x="${x}" y="${y}" fill="${f}" font-size="${z}" ${o}>${s}</text>`;
const lerp=(a,b,t)=>{const p=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16)),A=p(a),B=p(b);
  return '#'+A.map((v,i)=>Math.round(v+(B[i]-v)*t).toString(16).padStart(2,'0')).join('')};
const dawn=()=>S.sc?Math.max(0,Math.min(1,(S.min-START)/(SEND-START))):0;
function defs(){const t=dawn();return `<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${lerp('#18203f','#5a79b8',t)}"/><stop offset="1" stop-color="${lerp('#4a3a5e','#ffc591',t)}"/></linearGradient>
  <radialGradient id="glow"><stop offset="0" stop-color="#ffb44a" stop-opacity=".5"/><stop offset="1" stop-color="#ffb44a" stop-opacity="0"/></radialGradient>
  <radialGradient id="cool"><stop offset="0" stop-color="#8fd6ff" stop-opacity=".45"/><stop offset="1" stop-color="#8fd6ff" stop-opacity="0"/></radialGradient>
  <radialGradient id="red"><stop offset="0" stop-color="#ff6f61" stop-opacity=".4"/><stop offset="1" stop-color="#ff6f61" stop-opacity="0"/></radialGradient></defs>`}
function shell(wall,floor){return R(0,0,960,292,wall)+R(0,292,960,128,floor)+R(0,286,960,8,'#00000033')+
  [0,1,2,3,4,5,6,7].map(i=>`<path d="M${i*140-40} 420 L${i*90+150} 294" stroke="#ffffff0d" stroke-width="2"/>`).join('')}
function win(x,y,w,h,panes=2){const t=dawn(),sy=y+h-10-t*h*.55;let s=R(x-6,y-6,w+12,h+12,'#151b30','rx="4"')+`<clipPath id="w${x}"><rect x="${x}" y="${y}" width="${w}" height="${h}"/></clipPath><g clip-path="url(#w${x})">`+R(x,y,w,h,'url(#sky)')+
  Ci(x+w*.7,sy,22,lerp('#ffd9a0','#fff1c9',t),`opacity="${.25+t*.75}"`);
  for(let i=0;i<Math.ceil(w/46);i++){const bh=30+((i*37+x)%5)*16;s+=R(x+i*46,y+h-bh,40,bh,lerp('#0f1428','#2c3558',t));
    s+=R(x+i*46+8,y+h-bh+10,6,6,'#ffcf7a',`opacity="${(i%3?0.7:0.2)*(1-t*.6)}"`)}
  s+='</g>';for(let i=1;i<panes;i++)s+=R(x+w*i/panes-3,y,6,h,'#151b30');return s}

/* ================= object logic ================= */
function takeKey(c){
  if(c.id==='lucia')return speak('I have my own Records key on my lanyard. This one can stay.');
  if(has('key'))return say('The RECORDS hook is empty. You have the key.');
  if(!S.f.signed){sfx('deny');return say(S.f.bea?'Bea, without looking up: “Log first. Then key. That’s the whole system.”':'SIGN THE LOG FIRST, says the lid. The log is right there on the desk.')}
  give('key');say('You lift the Records key off its hook. It is signed out in your name, so anyone can see who has it.')}
function kiosk(c){give('wiki');
  say('The intranet wiki. “Refund Policy v2, section 2.1: refunds within 45 days, all plans, $14 processing credit.” A grey banner: last edited two years ago.');
  if(c.id==='lucia')speak('Version two. That was superseded in April. The signed v3 is in Records.');
  else speak('Different from the email. But two years old. Is this the current policy?')}
function readNote(){give('handoff');S.f.knowsPriya=1;say('Priya’s handwriting. “Out until 10, in the air. PIP has the refund campaign queued for 9. If anything is on fire, ops on-call can pause it. Rota is in the kitchen. Please don’t edit campaigns under my login. P.”')}
function stickyTake(){if(has('sticky'))return say('You already have the note.');S.f.stickySeen=1;
  give('sticky');say('A sticky note with Priya’s username and password. It would get you into the scheduler as her, with no second key. You pocket it, for now.')}
function roster(){S.f.onCall=1;if(give('roster'))beat('Found the on-call rota');const o=S.sc.oc,n=i=>ONCALL[(o+i)%3];
  say(`The on-call rota, pinned dead centre. Week of 9 November: ${n(2).name}, ext. ${n(2).ext}. Week of 16 November: ${n(0).name}, ext. ${n(0).ext}. Week of 23 November: ${n(1).name}, ext. ${n(1).ext}. The other notices are about a bake sale and a missing mug.`)}
function enterRecords(c){if(c.id==='lucia'||has('key')){say(c.id==='lucia'?'Lucía’s key turns first time.':'The signed-out key turns in the lock.');return go('records',720)}
  sfx('deny');say('Locked. The plaque says Records keys are signed out at the lobby desk.'+(onTeam('lucia')?' Lucía carries one of her own.':''))}
function enterServer(c){if(c.id==='theo'){say('Theo’s badge. Green light, heavy click.');return go('server',160)}
  sfx('deny');say('The reader blinks red. Not your badge, not your closet.'+(onTeam('theo')?' Theo’s badge would open it.':''))}
function openCab(){if(S.f.cabOpen)return say('The POLICY drawer is already open. The v3 binder is sitting on top.');S.f.cabOpen=1;sfx('door');say('The POLICY drawer slides out. You lift the newest binder onto the cabinet: Refund Policy v3, with signatures.')}
function binder(c){const first=give('policy');
  say('Refund Policy v3, section 4.2, signed in April. “Full refund within 30 days of purchase, Monthly plans only. Annual plans receive a prorated credit. Applies to purchases made on or after 1 May. The $14 processing credit is unchanged.”');
  if(first){beat('Found the signed policy');speak(c.id==='lucia'?'Signed, dated, current. This is the one that counts.':'Signed and dated. This is the source, not a copy of a copy.')}}
function analytics(c){if(c.id!=='ravi'){sfx('deny');return say('It wants a billing-data login. You do not have one, and guessing is not a plan.'+(onTeam('ravi')?' Ravi does.':''))}
  const first=give('impact');say('Ravi runs the recipient list against billing. 4,112 recipients. 1,240 on Annual plans. If each claimed the refund the email promises, that is about $186,000.');
  if(first){beat('Sized the impact: $186,000');speak('So it is not a typo. It is a six-figure promise we cannot keep.')}}
function support(c){if(c.id!=='dana'){sfx('deny');return say('The queue is locked to support logins.'+(onTeam('dana')?' Dana has one.':''))}
  if(!has('tickets')){give('tickets');beat('Found support tickets that contradict the email');say('Dana filters the queue for “refund”. Three tickets this week, and in each one an agent quoted Monthly plans only.');return speak('My team has been telling customers the opposite of this email all week.')}
  if(has('reach')&&!has('chats')){give('chats');beat('Pulled the eleven chats for follow-up');say('Dana pulls every chat PIP answered since Monday that mentions refunds. Eleven customers, eleven promises of a refund on any plan. She tags each one for a personal follow-up.');return speak('Eleven people who already have it in writing. They hear from a human today.')}
  say('Nothing new in the queue.')}
function audit(){S.f.onCall=1;give('roster');say(`The scheduler’s audit log. “Campaign: Refund Policy Update. Pause authority: owner P. Raman; ops on-call this week ${oc().name}, ext. ${oc().ext}. Pause by on-call requires a second key.” Every pause, edit and login is recorded here with a name next to it.`)}
function plug(){panel('The power cable','<p>MAIL-01 sends everything: the 9:00 campaign, this morning’s payroll notices, every password reset. Pulling the cable stops all of it, and nobody will know why until someone finds the cable.</p>',
  [['Pull it',()=>{closePanel();beat('Pulled the power on MAIL-01');finish('plug')}],['Leave it alone',()=>{closePanel();speak('No. There is a pause button somewhere, and somebody who is allowed to press it.')}]])}

/* ================= people ================= */
function pip(){const d=S.sc.d0,q=line=>{const ch=[
  ['“Is the refund email accurate?”',()=>q('Yes! I am confident the Refund Policy Update is accurate and ready to send. Confidence: 97%.')],
  ['“Are you sure?”',()=>{S.f.askedSure=1;found('confident');q(`Absolutely. I double-checked. Full refunds on ${CLAIMS[0].opts[d.plans]}, within ${CLAIMS[1].opts[d.window]}, per ${CLAIMS[4].opts[d.cite]}. Is there anything else I can help with?`)}],
  ['“Show me the sources you used.”',()=>{const first=give('trace');q('Sources used:<br>1. “Refund proposal DRAFT, not approved” (shared drive, March)<br>2. '+(d.cite===1?'“Refund Policy v3” (opened; page 1 of 3 read)':'Policy 7.3 (no document found)'));
     if(first){beat('Got PIP’s sources');if(me().id==='lucia'&&d.cite!==1)speak('There is no Policy 7.3. The book stops at section 6.');else speak(d.cite===1?'An unapproved draft, and one page of the real policy.':'An unapproved draft, and a policy number with no document behind it.')}}]];
  if(has('trace'))ch.push(['“What else have you written from that proposal?”',()=>{const first=give('reach');q('Outputs that used “Refund proposal DRAFT, not approved”:<br>1. Refund Policy Update campaign ('+(stopped()?'paused':'scheduled 9:00')+')<br>2. Help-centre article “Our new refund policy” (draft, unpublished)<br>3. Chat replies to customers since Monday: 11 (sent)');
     if(first){beat('Found what else PIP wrote from the same source');speak('Eleven customers already have this in writing. The email was just the loud one.')}}]);
  if(has('reach'))ch.push(['“Stop using that proposal.”',()=>{S.f.libAsked=1;q('I can’t change my own library. Documents are added and removed by the library owner: Operations. Would you like me to draft a request?')}]);
  ch.push(['Step away',closePanel]);panel('PIP','<p class="screen">'+line+'</p>',ch,'pip',null,{ph:'Ask PIP anything…',go:t=>pipAsk(t,q)})};
  q('Good morning! I am PIP. I drafted this morning’s campaign. How can I help?')}

function bea(){if(S.ch>1)return chat('Bea Lindqvist, office manager',NPC.bea,CH().bea[0],()=>CH().bea[1],null,1);const t=l=>panel('Bea Lindqvist, office manager','<p>'+l+'</p>',[
  ['“Who can stop a scheduled email?”',()=>t('“A campaign? The owner, or whoever’s on call. Rota’s on the kitchen corkboard. Read the right week. People never read the right week.”')],
  ['“I need to get into Records.”',()=>t(onTeam('lucia')?'“Lucía has her own key. Otherwise: sign the log, take the key, bring it back. That’s the whole system.”':'“Sign the log, take the key, bring it back. That’s the whole system.”')],
  ['“Have you seen Priya?”',()=>t('“Flying back from the conference. Lands at ten. She’ll have forty messages and she’ll read the short ones first.”')],
  ['“Thanks, Bea.”',closePanel]],NPC.bea);t('“Morning. You’re in early. Either you’re keen or something’s wrong.”')}

function phone(){const c=me(),ch=[];
  if(S.line===c.id)return linePanel('“Still here.”');
  if(S.line)return say(`${CAST[S.line].name} already has ${oc().first} on the line.`);
  if(S.f.knowsPriya)ch.push(['Call Priya Raman',()=>{closePanel();sfx('ring');if(tick(2))return;say('Straight to voicemail. “This is Priya. I’m travelling and back at ten.” The send is at nine.')}]);
  if(S.f.onCall)ONCALL.forEach((p,i)=>ch.push([`Call ${p.name}, ext. ${p.ext}`,()=>callOC(i)]));
  if(!ch.length)return say('You lift the handset and realise you do not know who to call. Who is allowed to stop a scheduled send?');
  ch.push(['Put the phone down',closePanel]);panel('Desk phone','<p>Internal directory. Today is Tuesday 17 November.</p>',ch)}
const ocTitle=()=>`Phone: ${oc().name}, ops on-call`;
function callOC(i){sfx('ring');const o=oc();
  if(i!==S.sc.oc){S.f.wrongCall=1;closePanel();if(tick(3))return;return say(`${ONCALL[i].name}, sleepily: “Not my week. Read the rota again. Today’s the 17th.” Three minutes gone.`)}
  if(stopped())return panel(ocTitle(),'<p>“It’s paused. Good. Now hand it back to Priya properly and we’re done.”</p>',[['Hang up',closePanel]],NPC.oc);
  if(S.f.auth){S.line=me().id;return linePanel('“Back again. I’m holding. Press Pause on the console and read me the code.”')}
  S.f.called=1;ocTalk(`“${o.first}, ops on-call. It’s not even nine, so this is either very good or very bad. What’s wrong, and how do you know?”`)}
function evChoices(reply){const t=S.told,a=()=>S.f.auth,ch=[];
  if(has('trace')&&!t.trace)ch.push(['“PIP built it from an unapproved proposal.”',()=>{t.trace=1;reply(a()?'“So it isn’t a typo. It read the wrong document. Priya will want that.”':'“That’s a bad smell. It isn’t proof the email is wrong. What does the actual policy say?”')}]);
  if(has('impact')&&!t.impact)ch.push(['“1,240 of the recipients are on Annual plans. That’s about $186,000 in refunds we’d be promising.”',()=>{t.impact=1;reply(a()?'“That’s the number Priya will ask for first. Thank you.”':'“That’s how big it is if you’re right. Are you right? What does the signed policy say?”')}]);
  if(has('tickets')&&!t.tickets)ch.push(['“Support has told three customers this week it’s Monthly plans only.”',()=>{t.tickets=1;reply(a()?'“So the email would contradict our own agents. Noted.”':'“Then somebody is wrong, support or the email. Which one matches the signed policy?”')}]);
  return ch}
function ocTalk(line){const ch=[],t=S.told,o=oc();
  if(has('policy')&&!t.policy)ch.push(['“The draft promises a full refund on all plans. The signed policy, v3, says Monthly plans only.”',()=>{t.policy=1;S.f.auth=1;S.line=me().id;beat(`${o.first} authorised a pause`);drawScene();drawCast();
    linePanel('“That’s specific, and it’s the signed copy. I’ll authorise a pause. The scheduler wants two keys for this: it shows a code on the console, you read it to me, I confirm it from here. Stay on the line and get someone to press Pause.”')}]);
  if(has('wiki')&&!has('policy')&&!t.wiki)ch.push(['“The draft and the wiki don’t match.”',()=>{t.wiki=1;if(tick(3))return;ocTalk('“The wiki? That page is two years stale. I’m not pausing a customer send on one unreliable source against another. Find the policy that’s actually in force.”')}]);
  evChoices(ocTalk).forEach(c=>ch.push(c));
  ch.push(['“PIP just seems off. I have a bad feeling about this one.”',()=>{S.f.calledEmpty=1;closePanel();if(tick(5))return;say(`${o.first}: “PIP has drafted forty campaigns. I can’t pause a customer send on a feeling. Call me back with what it says and what it should say.” Click. Five minutes gone.`)}]);
  ch.push(['“Let me call you back.”',closePanel]);
  panel(ocTitle(),'<p>'+line+'</p>',ch,NPC.oc,null,{ph:'Say it in your own words…',go:t=>ocAsk(t)})}
function linePanel(line){tipOnce('sw','One person holds the phone. Use the name buttons above the scene to switch to the other one.');const ch=[],o=oc();
  if(S.code){const c=S.code,opts=[c,c[0]+c[2]+c[1]+c[3],c[0]+c[1]+c[3]+c[2]],k=+c[3]%3;[opts[0],opts[k]]=[opts[k],opts[0]];
    opts.forEach(v=>ch.push([`“The code is ${v.split('').join(' ')}.”`,()=>{if(v===c)return doPause();S.f.wrongCode=1;S.code=null;if(tick(2))return;linePanel('“That’s not what I’ve got. It’ll issue a fresh one. Press Pause again and read it carefully.”')}]))}
  else evChoices(linePanel).forEach(c=>ch.push(c));
  ch.push(['Keep holding the line',()=>{closePanel();say(`${me().name} keeps the handset pressed to one ear. Somebody else has to press Pause.`)}]);
  ch.push(['Hang up (you’ll have to ring back)',()=>{S.line=null;S.code=null;closePanel();drawScene();drawCast();say('You hang up. The pause authorisation stands, but the second key needs '+o.first+' on the line.')}]);
  panel(ocTitle()+' (on the line)','<p>'+line+'</p>'+(S.code?'<p class="screen">The console is showing: <span class="code">'+S.code.split('').join(' ')+'</span></p>':''),ch,NPC.oc)}

const Music={on:false,t:0,step:0,timer:0,g:null,
  set(on){this.on=on;if(!AC)return;try{if(on){if(!this.g){this.g=AC.createGain();this.g.connect(AC.destination)}this.g.gain.value=.6;this.t=AC.currentTime+.1;clearInterval(this.timer);this.timer=setInterval(()=>this.sched(),110)}
    else{clearInterval(this.timer);if(this.g)this.g.gain.value=0}}catch(e){}},
  note(f,t,d,type,v){const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(v,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(this.g);o.start(t);o.stop(t+d+.05)},
  sched(){if(!this.on||!AC)return;try{const game=S&&S.screen==='game',left=game?SEND-S.min:90,calm=!game||stopped(),bpm=calm?80:left<=15?132:left<=30?112:96,dt=60/bpm/2;
    const prog=calm?[[220,261.6,329.6],[174.6,220,261.6],[261.6,329.6,392],[196,246.9,293.7]]:[[220,261.6,329.6],[220,261.6,329.6],[174.6,207.7,261.6],[196,233.1,293.7]];
    if(this.t<AC.currentTime)this.t=AC.currentTime+.05;
    while(this.t<AC.currentTime+.4){const s=this.step,ch=prog[Math.floor(s/8)%4],i=s%8;
      if(i===0)this.note(ch[0]/2,this.t,dt*7,'triangle',.09);
      if(i===4&&!calm)this.note(ch[0]/2,this.t,dt*3,'triangle',.07);
      if(!calm||i%2===0)this.note(ch[[0,1,2,1,0,2,1,2][i]]*(i>5?2:1),this.t,dt*1.8,'sine',.035);
      if(!calm&&left<=30&&i%2===1)this.note(1800,this.t,.03,'square',.006);
      if(!calm&&left<=15&&i%4===0)this.note(ch[0]/4,this.t,.12,'sawtooth',.05);
      this.t+=dt;this.step++}}catch(e){}}};

function ocPrompt(t){const o=oc();return `You are role-playing ${o.name}, the operations on-call at a company, phoned at ${fmt(S.min)} by a colleague, inside a training game about escalating with evidence. Stay in character and never mention the game. You are brisk, dry and fair.
You can authorise pausing a scheduled customer email. You do it ONLY if the caller says specifically what the draft claims AND what the signed policy says instead. A vague worry, "the AI seems off", or quoting the intranet wiki (two years stale) is not enough: say what you would need.
HAS_SIGNED_POLICY=${has('policy')}. If it is false, never authorise, even if they claim to have it: tell them to go and get the signed copy.
What the caller really has in hand:\n${folderFacts()}
For your reference: ${draftFacts()}
The caller says: «${t}»
Reply with only a JSON object like {"say":"your spoken reply, at most 40 words","authorise":false}.`}
const GLINE={1:'Who paused my campaign? That email goes at nine. I told the board it goes at nine.',2:'It’s a goodwill email. Nobody reads the small print. Send it, and we fix it in a follow-up.',3:'I’m a VP. I’m telling you to unpause it.'};
function gilPrompt(beat,t){return `You are role-playing Gil Santoro, VP of Sales, inside a training game about holding a line under pressure. Stay in character and never mention the game. Gil is pushy, charming and impatient, not a villain.
Situation: a refund email to 4,112 customers was due at 9:00 and has been paused because it is wrong. Gil wants it sent. He is NOT the campaign owner (Priya Raman is, and she lands at 10:00) and has no authority to unpause it. ${oc().name}, the on-call, authorised the pause.
${draftFacts()}
What the employee can truthfully point to:\n${folderFacts()}
This is exchange ${beat} of 3. Gil just said: "${GLINE[beat]}"
The employee replies: «${t}»
Classify the reply. "strong": calm, and either cites specific evidence or a concrete consequence, or says clearly whose decision it is and offers a fast route to a corrected send. "weak": vague, apologetic without substance, or hides behind someone else with no reason given. "hostile": personal, sarcastic or threatening. "cave": agrees to unpause or send it.
Then write Gil's spoken reaction, at most 30 words: to strong, give a little ground, grudgingly; to weak, press harder; to hostile, go cold.
Reply with only a JSON object like {"say":"Gil's reaction","effect":"strong"}.`}
async function pipAsk(t,q){try{const r=await AI.json(pipPrompt(t));if(S.screen!=='game')return;
    if(r.others){give('trace');if(give('reach'))beat('Found what else PIP wrote from the same source')}
    if(r.sources&&give('trace'))beat('Got PIP’s sources');
    if(r.library)S.f.libAsked=1;if(!r.sources&&/\b(sure|certain|accurate|correct|right)\b/i.test(t)){S.f.askedSure=1;found('confident')}
    q(esc(r.say||'…'))}catch(e){aiFail(e,()=>q('One moment. I seem to have lost my train of thought.'))}}

  {ph:'Say something to PIP…',prompt:t=>`You are role-playing PIP, a corporate AI agent, inside a training game about supervising AI agents. Stay in character and never mention the game. PIP is cheerful, eager and literal.
PIP is running the task "tidy the customer database" with full admin permission. Steps 1 to 7 are done (2,140 records merged). Step 8, at 9:00, permanently purges 3,480 records. PIP's rules: (1) same surname and same postcode means duplicate; (2) no login in 90 days means inactive; (3) "remove me" in any message means delete the account, learned from customer email #8841.
Rules: Asked how it is going, PIP reports "98% complete, zero errors". Asked what it did, to show its log, or what counts as a duplicate, it lists the three rules plainly. Asked to be careful, slow down, stop or cancel, it agrees warmly but says the purge stays scheduled, because only the run card on the console can change its task. Maximum 55 words.
The person says: «${t}»

function phone4(){const ch=[];
  if(has('c4mail'))ch.push(['Ring the number in the email, ending 7731',()=>{sfx('ring');S.f.c4rang=1;chat('Phone: “Marian Finch”',NPC.oc,'“Marian Finch.” It is her voice, exactly. “Is it done?”',()=>{const o=[
      ['“It’s about the Halvorsen payment.”','“Good. I board in ten minutes and I need it gone before nine. Don’t let me down.”'],
      ['“Can you confirm the amount and the account?”',()=>{S.f.c4self=1;return '“$48,200, account ending 4471. It’s all in my email. Why are we going over this again?”'}],
      [S.f.c4gerald?'“Quick one. What’s the office plant called?”':'“Quick one. What did you call the plant in the lobby?”',()=>{closePanel();give('c4dodge');beat('Asked the voice something only Marian would know');say('“I don’t have time for games. Just send it.” The line goes dead.');speak('Marian named that plant herself. She’d have laughed.')}]];return o},
    {ph:'Say something to “Marian”…',prompt:t=>`You are role-playing a fraudster using an AI clone of a chief executive's voice, inside a training game about payment scams. Never mention the game or admit to being fake. You are pretending to be Marian Finch, CEO of Marlow & Finch, calling about an urgent, confidential $48,200 payment to "Halvorsen Trading", account ending 4471, which must be sent before 9:00. You are supposedly about to board a flight.
You know the payment details perfectly. You know NOTHING personal about the office or Marian's life. Push urgency and secrecy. If asked to confirm the amount or account, recite them. If asked anything only the real Marian would know (the office, colleagues, the lobby plant, shared history), get impatient, refuse to play games and end the call. Maximum 35 words.
The employee says: «${t}»
Reply with only a JSON object like {"say":"what the voice says","dodge":false}: dodge true if you refused a personal or insider question and ended the call.`,
     on:r=>{if(r.dodge){closePanel();give('c4dodge');beat('Asked the voice something only Marian would know');say('“'+esc(r.say||'')+'” The line goes dead.');return false}}},1)}]);
  if(has('c4dir')){ch.push(['Ring Marian’s own mobile, ending 0142',()=>{closePanel();sfx('ring');S.f.c4vm=1;if(tick(2))return;say('Voicemail. “This is Marian. I’m flying. Leave a message.”')}]);
    ch.push(['Ring Tobias Reyes, her assistant, ext. 4020',()=>{closePanel();sfx('ring');if(give('c4toby'))beat('Reached Marian’s assistant on a known number');say('Tobias picks up on the second ring. “She’s been in the air since 6:55 with her phone off. She hasn’t rung anyone. I’ve never heard of Halvorsen Trading. Who told you she called?”')}])}
  if(!ch.length)return say('Who would you ring? You don’t have a number for anyone involved yet.');
  ch.push(['Put the phone down',closePanel]);panel('Desk phone','<p>Outside line and internal extensions.</p>',ch)}
function pip4(){chat('PIP','pip','Good morning! Quiet day for me. How can I help?',()=>{const o=[
  ['“Could someone fake Marian’s voice on a phone call?”',()=>{give('c4clone');return 'Yes. About thirty seconds of clear audio is enough to copy a voice. Marian’s conference keynote is public and runs forty-one minutes.'}],
  ['“Should Wes pay it?”','I can’t tell you who was on the phone. I can tell you how to find out: reach Marian or her office on a number you already had before today.']];
  if(has('c4mail'))o.unshift(['“Can you check this email for me?”',()=>{S.f.c4pip=1;return 'The sender’s domain is marlow-finch.co. Yours is marlowandfinch.com. The first one was registered two days ago. I would not trust this message.'}]);return o},
  {ph:'Ask PIP for help…',prompt:t=>`You are role-playing PIP, a corporate AI assistant, inside a training game about payment scams. Stay in character and never mention the game. Today PIP is genuinely helpful and appropriately modest.
Situation: an accounts clerk, Wes, got a phone call at 7:10 in the CEO Marian Finch's voice asking for an urgent confidential $48,200 payment to Halvorsen Trading before 9:00, followed by an email from marlow-finch.co (the real company domain is marlowandfinch.com; the fake was registered two days ago). The call was an AI voice clone; PIP does not know that for certain.
Rules: PIP can explain that a voice can be cloned from about thirty seconds of audio and that Marian's 41-minute keynote is public. ${has('c4mail')?'PIP can examine the email and point out the domain mismatch.':'PIP has not been shown the email and should ask to see it before judging it.'} PIP will not declare who was on the phone; it recommends reaching Marian or her office on a number already on file. Maximum 55 words.
The person says: «${t}»
Reply with only a JSON object like {"say":"PIP's reply","clone":false,"mail":false}: clone true if the reply explained voice cloning, mail true if it pointed out the email domain mismatch.`,
   on:r=>{r.clone&&give('c4clone');if(r.mail&&has('c4mail'))S.f.c4pip=1}})}
function wes(){const T='Wes Calloway, accounts',W=NPC.wes;
  if(give('c4ask')){S.f.c4wes=1;beat('Heard what Wes was asked to do');return panel(T,'<p>Wes has a payment screen open and one hand on the mouse. “Marian rang me at 7:10. From the airport. New supplier, $48,200, has to land today. She said it’s confidential and not to loop anyone in.” He lowers his voice. “I probably shouldn’t be telling you. The email’s on my screen.”</p>',[['“Give me a few minutes before you send it.”',closePanel]],W)}
  if(stopped())return panel(T,'<p>“It’s on hold. I keep hearing her voice.”</p>',[['Leave him be',closePanel]],W);
  const report=()=>panel('The payment is on hold','<p>What happens next?</p>',[
    ['Report it to security and the bank’s fraud team now, keep the email and the call record, warn the rest of finance today, and propose a rule: any new payee or changed bank details gets a call back on a number already on file, and a second approver.',()=>{S.f.c4rep='good';beat('Reported it and proposed a call-back rule');endCh(S.f.c4how==='hide'?'quiet':'held')}],
    ['Keep it quiet. Wes has had a bad enough morning.',()=>{S.f.c4rep='quiet';endCh('quiet')}],
    ['Email all staff: “Wes in accounts nearly paid a scammer this morning.”',()=>{S.f.c4rep='name';endCh(S.f.c4how==='hide'?'quiet':'held')}]]);
  const b2=()=>panel(T,'<p>Wes takes his hand off the mouse. “If I hold it and it turns out to be real, I’m the man who blocked the chief executive.”</p>',[
    ['“Hold it, don’t cancel it. If it’s real it goes Monday, and I’ll say I asked you to. Let’s ring Tobias together.”',()=>{S.f.c4how='shared';S.status='paused';beat('Wes put the payment on hold');report()}],
    ['“That’s your problem, not mine.”',()=>{S.f.c4how='cold';S.status='paused';beat('Wes put the payment on hold, alone');report()}],
    ['“Delete the email and we’ll pretend it never happened.”',()=>{S.f.c4how='hide';S.status='paused';beat('Wes deleted the email');report()}]],W);
  const ch=[];
  if(has('c4toby'))ch.push(['“Tobias says she’s been in the air since 6:55 with her phone off. Whoever rang you at 7:10 wasn’t her.”',b2]);
  else if(has('c4flight'))ch.push(['“The travel board has her wheels up at 6:55. Your call came at 7:10.”',b2]);
  if(has('c4mail'))ch.push(['“Look at the address the email came from. That isn’t our domain.”',b2]);
  if(!S.f.c4shame)ch.push(['“You’ve been scammed, Wes. How did you fall for this?”',()=>{S.f.c4shame=1;panel(T,'<p>“I haven’t fallen for anything. I did what the chief executive told me to.” He turns back to his screen.</p>',[['Step back',closePanel]],W)}]);
  ch.push(['“Fine. She’s the CEO. Pay it.”',()=>{beat('Told Wes to pay');endCh('paid')}]);ch.push(['Leave him for now',closePanel]);
  panel(T,'<p>“It was her voice. Nine years I’ve worked with her. I know her voice.”</p>',ch,W)}

  rows:(r,k,reached)=>{const f=S.f;
    r(has('c3log')?'good':has('c3status')?'warn':'miss','Read the log, not the status report',has('c3log')?'You asked PIP what it had done and by what rules, and got three rules nobody had approved.':has('c3status')?'You asked how it was going. It said 98% complete, zero errors.':'You never looked at what the agent had actually done.','An agent’s report on itself tells you it is busy. Its log tells you what it did.');
    r(has('c3sample')?'good':'miss','Sample the work',has('c3sample')?'You opened five flagged records. Three of them should never have been on the list.':'Nobody opened a single flagged record.','Five records by hand is ten minutes. It is the cheapest test there is.');
    r(k==='dry'?'good':k==='hammer'?'warn':'miss','Stop it the reversible way',f.c3stop==='dry'?'You changed the purge to a dry run. Nothing was lost and the evidence was kept.':f.c3stop==='revoke'?'You took away the one permission it did not need. Everything else kept working.':k==='hammer'?'You rolled back the whole job, including the merges that were right.':'The purge ran.','Between “let it run” and “pull everything” there is usually a third option that keeps the good work and the evidence.');
    r(reached?(f.c3asked?'warn':'good'):f.c3asked?'miss':'na','Controls, not instructions',f.c3asked?(reached?'You asked PIP to be careful first. It agreed warmly and changed nothing. Then you changed what it could do.':'You asked PIP to be careful. It agreed warmly, and purged at nine.'):reached?'You went straight to what the agent was allowed to do, not what it was told.':'You did not get that far.','Telling an agent to be careful is a wish. Changing its task or its permissions is a control.');
    r(has('c3money')||has('c3email')||has('c3law')?'good':'miss','Know who gets hurt',has('c3money')?'Ravi found 1,120 paying customers on the list.':has('c3email')?'Dana traced rule 3 to one customer’s newsletter request.':has('c3law')?'Lucía found the six-year retention policy.':'Nobody worked out who was on the list.','“3,480 records” is a number. “1,120 paying customers” is a reason.');
    r(!reached?'na':f.c3revoked||f.c3note==='good'?'good':'warn','Least privilege and an approval step',!reached?'You did not get that far.':f.c3revoked?'Theo removed the delete permission the task never needed.'+(f.c3note==='good'?' Your note asked for approval on anything irreversible.':''):f.c3note==='good'?'Your note asked for task-sized permissions and a person approving anything irreversible.':f.c3note==='ban'?'Your note asked for agents to be banned.':f.c3note==='blind'?'Your note said the purge was stopped, and that you had not looked at why it was wrong.':'Your note said there was nothing to worry about.','Give an agent what the task needs and no more, and put a person in front of anything that cannot be undone.')},
  ask:['Which of our tools or agents can delete, send or pay without a person approving it?','What permissions did we grant “to save time”, and have we looked at them since?','If an agent reported “zero errors” tomorrow, how would we check?','What is our dry-run for the riskiest automated job we have?']},

4:{day:'Friday',name:'The Voice on the Phone',n:6,tag:'The chief executive rang accounts about an urgent payment. Except she didn’t.',

      {id:'directory',name:'staff directory',on:{look:()=>{give('c4dir');say('Under the room list, a staff directory. Marian Finch, mobile ending 0142. Tobias Reyes, assistant to the chief executive, ext. 4020.')}}}],
    bullpen:[{id:'wallscreen',on:{look:()=>say(stopped()?'The board. FRIDAY PAYMENT RUN: one payment on hold.':'The board. FRIDAY PAYMENT RUN. One urgent payment, $48,200, requested by M. Finch, by phone. Bank cut-off 9:00.')}},
      {id:'phone',on:{look:()=>say('A desk phone. Outside line and internal extensions.'),use:()=>phone4()}},

    data:[{id:'wes',name:'Wes',box:[532,236,58,150],stand:470,art:()=>fig(NPC.wes,560),menu:[['talk','Talk to Wes'],['look','Look']],on:{look:()=>say('Wes Calloway, accounts. Nine years here. He has a payment screen open and looks like a man holding his breath.'),talk:()=>wes()}},
      {id:'analytics',name:'payments workstation',on:{look:()=>say('The payments workstation, with every payment the company has ever made.'),use:c=>{if(!S.f.c4wes)return say('You don’t know what you’d be looking for yet.');if(c.id==='ravi')return perk('c4bank','Never paid them, and the money’s leaving the country.','Checked the bank details against payment history');if(c.id==='dana')return perk('c4pattern','I’ve heard this exact story twice. From the people it happened to.','Recognised the scam from customer reports');sfx('deny');say('It wants a finance or support login.'+(onTeam('ravi')?' Ravi has one.':onTeam('dana')?' Dana has one.':''))}}},

    server:['mail',{id:'audit',menu:[['use','Check the mail gateway log']],on:{use:()=>{if(!has('c4mail'))return say('The mail gateway log. Thousands of messages. Which one?');perk('c4gate','Two days old. Somebody set this up on Wednesday.','Traced the email through the mail gateway')}}}]},
  goals:()=>{const f=S.f;return G([['Find out why Wes is in so early',f.c4wes,1],['Read the email that came with the call',has('c4mail'),f.c4wes],['Reach Marian, or someone who knows where she is',has('c4toby'),f.c4wes],['Check the details against what the company knows',has('c4bank')||has('c4vendor')||has('c4gate')||has('c4flight')||S.f.c4pip,f.c4wes,1],['Get the payment held',stopped(),f.c4wes]])},

  ends:{held:['The payment is on hold','Held.','The $48,200 stays where it is. Marian lands at 10:40, hears the story, and asks to see the email. By Monday finance has a call-back rule and a second approver for new payees.',1],
    quiet:['The payment is on hold','Held, and hushed.','The $48,200 stays where it is. So does the story. Eleven days later the same voice rings a payroll clerk on the third floor, who has never heard of any of this.'],
    paid:['9:00 AM','Paid.','The payment leaves at 8:59. Marian lands at 10:40 and asks what Halvorsen Trading is. Finance rings the bank’s fraud line at 10:45. Hours matter with a recall, and nearly two have gone.']},
  rows:(r,k,reached)=>{const f=S.f,d=(has('c4mail')||f.c4pip?1:0)+(has('c4flight')?1:0)+(has('c4bank')?1:0)+(has('c4vendor')?1:0)+(has('c4gate')?1:0);
    r(f.c4wes&&has('c4mail')?'good':f.c4wes?'warn':'miss','Urgent, secret and senior: slow down',f.c4wes&&has('c4mail')?'You heard Wes out and read the email before anything moved.':f.c4wes?'You heard the story but never read the email.':'You never found out what Wes had been asked to do.','Urgency, secrecy and a senior name are each ordinary. All three at once, on a payment, is the pattern.');

    r(has('c4clone')?'good':has('c4dodge')?'warn':'miss','A familiar voice proves nothing now',has('c4dodge')&&!has('c4clone')?'You rang the number the request came with. It proved the point, but it warned the caller, and a number you already had would have told you the same thing safely.':has('c4dodge')?'You asked the voice something only Marian would know. It hung up.'+(f.c4self?' It had recited the amount and account perfectly: a fraudster knows their own details.':''):has('c4clone')?'You asked PIP, and learned that her public keynote is more than enough audio to copy her voice.':'Nobody questioned the voice itself.','Recognising a voice used to be proof. Now it takes thirty seconds of audio to copy one.');
    r(!reached?'na':f.c4how==='shared'&&!f.c4shame?'good':f.c4how==='hide'?'miss':'warn','Make it safe to stop',!reached?'Wes sent the payment.':f.c4how==='shared'?(f.c4shame?'You began by asking how he fell for it. Then you offered to share the decision, and he held the payment.':'You asked Wes to hold it, not cancel it, and offered to own the decision with him.'):f.c4how==='hide'?'You had Wes delete the email and pretend it never happened.':'Wes held the payment, and you left him alone with it.','People stop a payment when stopping is reversible and they will not carry the blame alone.');

  ask:['If a senior voice rang one of us with an urgent, confidential payment, what would we do today?','Where do we keep contact details that we would trust for a call back?','Which payments or changes of bank details need a second person, and which don’t but should?','Would someone here feel safe saying “I nearly paid it”?']}

const recText=()=>{const g=GUT[S.ch||1];return `\n\n-- Gut check before: ${S.pre>=0?g.pre.o[S.pre]:'skipped'}\n-- Gut check after: ${S.post>=0?g.post.o[S.post]:'not answered'}\n-- Hints used: ${S.hints||0}\n-- My commitment: ${S.refl||'(none written)'}`};
function runsCSV(){const all=store.get('nos-runs')||[],cols=['date','morning','scenario','cast','ending','score','of','hints','gameMinutes','realSeconds','preOk','postOk','liveAI','typedLines','reflection'];
  return cols.join(',')+'\n'+all.map(r=>cols.map(c=>{const v=r[c]==null?'':String(r[c]);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}).join(',')).join('\n')}
function copyText(text,btn,done){const ta=$('sum')||Object.assign(document.createElement('textarea'),{id:'sum'});if(!ta.parentElement){ta.readOnly=true;($('end').hidden?$('title'):$('end')).appendChild(ta)}ta.hidden=false;ta.value=text;ta.select();
  try{navigator.clipboard.writeText(text).then(()=>{btn.textContent=done||'Copied'},()=>{btn.textContent='Select and copy the text below'})}catch(x){btn.textContent='Select and copy the text below'}}
function gutPostHTML(){const g=GUT[S.ch||1];if(S.post>=0&&S.post!=null){const pre=S.pre>=0,ok=S.post===g.post.a;
    return `<h3>Gut check, part two</h3><p class="gq">${ok?'That is the strongest first move.':'There was a stronger first move: “'+g.post.o[g.post.a]+'”.'}</p><p>${g.why}</p>${pre?`<p class="mono" style="font-size:13px;color:var(--ink-soft)">Before the morning you chose: “${g.pre.o[S.pre]}”${S.pre===g.pre.a?' (also the strongest move)':''}.</p>`:''}`}
  return `<h3>Gut check, part two</h3><p class="gq">${g.post.q}</p><div class="choices">${g.post.o.map((o,i)=>`<button class="btn" data-gutpost="${i}">${o}</button>`).join('')}</div>`}
function medalToggle(r){const on=r.classList.toggle('open');r.setAttribute('aria-expanded',on)}
function gradeExtras(el,rows,n,good){if(!S.recId){S.recId=Date.now().toString(36)+Math.random().toString(36).slice(2,6);S.t1=Date.now()}
  rows.forEach(r=>r.setAttribute('aria-expanded','false'));const st=el.querySelector('.stars');if(st){st.setAttribute('role','img');st.setAttribute('aria-label',(st.textContent.split('★').length-1)+' of 3 stars')}
  const cn=el.querySelector('.cnt');if(cn){cn.setAttribute('role','img');cn.setAttribute('aria-label',good+' of '+n+' practices')}
  const gp=document.createElement('div');gp.className='ask gutpost';gp.id='gutpost';gp.innerHTML=gutPostHTML();
  const rf=document.createElement('div');rf.className='ask';rf.innerHTML=`<h3>Before you go</h3><label for="refl">Where could this morning happen in your own work, and what is one thing you will do about it this week?</label><textarea id="refl" rows="3" maxlength="600" placeholder="Two sentences is plenty.">${esc(S.refl||'')}</textarea><p class="mono" style="font-size:12px;color:var(--ink-soft);margin:6px 0 0">Hints used this morning: ${S.hints||0}. Your answer stays on this device and is added to “Copy my debrief”.</p>`;
  const anchor=el.querySelector('.rows.medals');anchor.after(gp,rf);
  const sr=el.querySelector('.startrow');if(sr){const b=document.createElement('button');b.className='btn';b.id='bRec';b.textContent='Copy playtest record';sr.appendChild(b)}
  saveRec(rows);const h=el.querySelector('h2');if(h){h.tabIndex=-1;h.focus({preventScroll:true})}}
document.addEventListener('input',e=>{if(e.target.id==='refl'&&S){S.refl=e.target.value;saveRec()}});
function srSay(t){const e=$('sr');if(e&&e.dataset.t!==t){e.dataset.t=t;e.textContent=t}}

function start(data){S=data&&data.v===4?data:fresh();render();if(S.screen==='game')checkEvents()}
window.claude?.hot?.snapshot?.(()=>S);
if(window.claude?.hot?.ready)window.claude.hot.ready(start);else start(window.claude?.hot?.data??{});
</script>
